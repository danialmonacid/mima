<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Una sola columna tipo app de celular, centrada en pantallas grandes. Un solo tema claro, a propósito (es el sistema aprobado). */
:root{
  --bg:#F9F7F4; --card:#FFFFFF; --line:#F1EEEA; --line2:#F4F1ED; --ink:#1F1F1F; --ink2:#4B5563; --ink3:#6B7280;
  --lila:#C5B9E9; --lila-b:#9874EF; --lila-t:#3A3254;
  --amb:#FBE3B5; --amb-b:#E9A93C; --amb-t:#5C3A00;
  --coral:#F07A6E; --rojo:#DC2626; --rojo-t:#B91C1C; --rojo-bg:rgba(220,38,38,.08); --rojo-sq:rgba(220,38,38,.14);
  --ver-bg:rgba(245,158,11,.10); --ver-sq:rgba(245,158,11,.22); --ver-i:#B45309; --ver-t:#7A4100;
  --ok:#15803D; --neutro:#F4F1ED; --ahorro-bg:#ECE6FB; --ahorro-i:#5B3FB5; --ahorro-card:#F6F3FD; --ahorro-line:#E4DCF8;
  --dim:rgba(31,31,31,.5); --sombra:0 6px 24px rgba(31,31,31,.12);
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--f);color:var(--ink);font-size:16px;font-weight:500;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;color:inherit}
a{color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:16px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#app.flow{padding-bottom:28px;min-height:100vh}
h1,h2,p{margin:0}
.mes{font-size:34px;font-weight:800;line-height:1.1;text-wrap:balance}
.h1{font-size:28px;font-weight:600;line-height:1.15;text-wrap:balance}
.h2{font-size:22px;font-weight:600;line-height:1.25;text-wrap:balance}
.q{font-size:17px;font-weight:600}
.sub{font-size:18px;font-weight:500;color:var(--ink2)}
.txt{font-size:16px;font-weight:500;color:var(--ink2);line-height:1.4}
.small{font-size:15px;font-weight:500;color:var(--ink2);line-height:1.35}
.lbl{font-size:14px;font-weight:800;color:var(--ink2)}
.cifra{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.5px}
.logo{height:26px;width:auto;display:block}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.back,.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:17px;font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-decoration:none;color:var(--ink)}
.link.u{text-decoration:underline;text-underline-offset:3px}
.hero{border-radius:28px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;border:2px solid}
.hero.lila{background:var(--lila);border-color:var(--lila-b)}
.hero.amb{background:var(--amb);border-color:var(--amb-b)}
.bar{height:12px;border-radius:6px;background:rgba(255,255,255,.85);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--barra)}
.bar.gris{background:#E6E0F5}
.sec{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;min-height:72px;text-align:left;width:100%;cursor:pointer;text-decoration:none;color:var(--ink)}
.sq{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;position:relative;background:var(--neutro)}
.sq.s{width:40px;height:40px;border-radius:12px}.sq.s .ic{width:22px;height:22px}
.cat{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;border-radius:8px;padding:2px 8px 2px 5px;font-size:13px;font-weight:700;margin-top:3px;max-width:100%}.cat .ic{width:15px;height:15px}
.sq.xxs{width:20px;height:20px;border-radius:6px}.sq.xxs .ic{width:13px;height:13px}
.sq.xs{width:36px;height:36px;border-radius:11px}.sq.xs .ic{width:20px;height:20px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:18px;font-weight:600;line-height:1.2}
.s{font-size:15px;font-weight:500;color:var(--ink2)}
.rt{min-width:86px;display:flex;flex-direction:column;align-items:flex-end}
.rt .l{font-size:14px;font-weight:800;color:var(--ink2)}
.v{font-size:20px;font-weight:600}
.warn{color:var(--ver-t)!important;font-weight:600}
.pt{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--coral);border:2.5px solid #fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:28px;border:0;background:var(--ink);color:#fff;font-size:18px;font-weight:600;width:100%;cursor:pointer;text-decoration:none;padding:0 20px}
.btn[disabled]{background:#E6E1DB;color:var(--ink2);cursor:not-allowed}
.btn.rojo{background:var(--rojo-t)}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:28px;border:0;background:var(--card);box-shadow:var(--sombra);font-size:17px;font-weight:600;width:100%;cursor:pointer;color:var(--ink);padding:0 20px}
.btn3{display:flex;align-items:center;justify-content:center;min-height:48px;font-size:17px;font-weight:600;background:none;border:0;width:100%;cursor:pointer;color:var(--ink)}
.btn3.rojo{color:var(--rojo-t)}
.grp{background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;min-height:60px;border-bottom:1.5px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:var(--ink)}
.li:last-child{border-bottom:0}
.li.static{cursor:default}
.n{flex:1;min-width:0;display:flex;flex-direction:column}
.n b{font-size:17px;font-weight:600}
.n small{font-size:14px;font-weight:500;color:var(--ink2)}
.lv{font-size:17px;font-weight:600}
.pen{width:18px;height:18px;color:var(--ink3)}
.chev{color:var(--ink3)}
.card{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:10px 14px}
.row{display:flex;align-items:center;gap:12px;min-height:46px;background:none;border:0;padding:0;text-align:left;width:100%;color:var(--ink);cursor:pointer}
.mark{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;padding:2px 0 0;border:0;border-top:1.5px solid rgba(31,31,31,.08);background:transparent;font-size:16px;font-weight:500;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 3px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:500;letter-spacing:-.2px;min-width:0;cursor:pointer;overflow-wrap:anywhere;text-align:center}
.chip .sq{width:40px;height:40px;border-radius:12px}.chip .sq .ic{width:22px;height:22px}
.chip .pt{width:13px;height:13px}
.chip.on{border:2.5px solid var(--ink);padding:9px 2px;font-weight:800}
.valor{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.resumen{display:flex;flex-direction:column;gap:6px;padding:2px 0;margin-top:6px}
.r-lbl{font-size:16px;font-weight:700;color:var(--ink2)}
.r-cifra{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.r-bar{height:8px;border-radius:4px;background:#E6E0F5;overflow:hidden;margin-top:6px}
.r-bar i{display:block;height:100%;border-radius:4px;background:var(--barra)}
.r-filas{margin:8px 0 0;display:flex;flex-direction:column}
.r-filas>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1.5px solid #E9E4DE}
.r-filas>div:last-child{border-bottom:1.5px solid #E9E4DE}
.r-filas dt{font-size:16px;font-weight:500;color:var(--ink2)}
.r-filas dd{margin:0;font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap}
.montoInp{display:block;width:100%;border:0;background:transparent;text-align:center;padding:0;margin:0;font-family:inherit;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.montoInp::placeholder{color:#C9C2BA}
.valor:focus-within{border-color:var(--ink)!important}
.montoInp:focus-visible{outline:none}
.valor .cifra{font-size:44px;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{min-height:58px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-size:28px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--neutro)}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:500;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.opt.on{border:2.5px solid var(--ink);padding:7px 13px;font-weight:800}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.opt small{display:block;font-size:15px;font-weight:500;color:var(--ink2);margin-top:2px;line-height:1.3}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #9C958D;flex:none;background:#fff}
.opt.on .radio{border:7px solid var(--ink)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg .opt{min-height:56px}
.inp{min-height:56px;border-radius:16px;border:1.5px solid #CFC8C0;background:var(--card);padding:0 16px;font-size:18px;font-weight:500;width:100%}
/* iPhone hace zoom (y la pantalla salta) al tocar un campo con letra de menos de 16px. Con el tamaño de texto reducido, 18px quedaba en 15.8px. */
.inp{font-size:max(18px, calc(16.5px / var(--z,1)))}
.inp:focus{outline:none;border:2px solid var(--ink)}
.sug{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid #E6E1DB;background:var(--card);font-size:15px;font-weight:500;cursor:pointer}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.st{width:44px;height:44px;border-radius:50%;border:1.5px solid #DCD6CF;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.st .ic{stroke-width:2.4}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps i{display:block;height:8px;border-radius:4px;background:#E6E1DB}.steps i.on{background:var(--barra)}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(102px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;border:0;box-shadow:0 8px 20px rgba(31,31,31,.25);cursor:pointer;z-index:5}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 28px));bottom:calc(14px + env(safe-area-inset-bottom,0px));height:76px;background:#fff;border-radius:38px;box-shadow:var(--sombra);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:800;color:var(--ink3);border-radius:33px;border:0;background:none;cursor:pointer;position:relative}
.tab.on{background:var(--lila);color:var(--ink)}
.dot{position:absolute;top:-2px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.overlay{position:fixed;inset:0;background:var(--dim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:480px;padding:12px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.grab{width:48px;height:5px;border-radius:3px;background:#DCD6CF;align-self:center}
.mopt{display:flex;align-items:center;gap:14px;min-height:88px;padding:14px 16px;border-radius:22px;background:var(--bg);border:0;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.mopt .sq{width:56px;height:56px;border-radius:18px}.mopt .sq .ic{width:28px;height:28px;stroke-width:2.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 40px));bottom:calc(104px + env(safe-area-inset-bottom,0px));min-height:60px;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;box-shadow:0 8px 20px rgba(31,31,31,.25);z-index:30}
.toast.flow{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.toast span{flex:1;font-size:16px;font-weight:600;line-height:1.3}
.toast button{min-height:44px;padding:0 12px;border:0;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.empty{background:var(--card);border:1.5px dashed #DCD6CF;border-radius:20px;padding:18px;text-align:center}
.alerta{background:var(--rojo-bg);border-radius:28px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
#app.flow{padding-bottom:0}
#app.flow .bottom{position:sticky;bottom:0;z-index:4;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:12px max(20px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg,#F9F7F4);border-top:1px solid transparent;transition:background-color .2s,box-shadow .2s,border-color .2s}
#app.flow .bottom.flota{background:rgba(249,247,244,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-top-color:rgba(31,31,31,.06);box-shadow:0 -8px 20px rgba(31,31,31,.05)}
:focus-visible{outline:3px solid var(--lila-b);outline-offset:2px}
/* próximo mes: naranja de alerta media, borde punteado = es un estimado */
:root{--prox-bg:#FFD3AE;--prox-b:#EE7E2C;--prox-t:#6B2A00;--prox-card:#FFF3E8;--prox-fuerte:#F28A36}
.prox{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--prox-card);border:2px dashed var(--prox-b);border-radius:24px;padding:16px 18px;cursor:pointer;color:var(--ink);font:inherit}
.prox-tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--prox-bg);color:var(--prox-t);border-radius:14px;padding:4px 10px;font-size:14px;font-weight:800}
.prox-tag .ic{width:18px;height:18px}
.prox-fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prox-fila .q{font-weight:500;color:var(--ink2);font-size:16px}
.prox-cta{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:24px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;margin-top:2px}
.prox-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));margin-top:-16px;padding:8px max(20px,env(safe-area-inset-left,0px)) 10px;background:var(--bg);display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 14px rgba(31,31,31,.05)}
.prox-band{display:flex;align-items:center;gap:10px;background:var(--prox-fuerte);color:#2B1100;border-radius:16px;padding:12px 14px;font-size:17px;font-weight:700;line-height:1.3}
.prox-band b{font-weight:800}
.prox-band .ic{width:24px;height:24px;stroke-width:2.4}
.hero.proxh{background:var(--prox-bg);border:2px dashed var(--prox-b)}
.card.pre{background:transparent;border-style:dashed;border-color:#C9D9E8}
/* el resumen de Cuentas es informativo: azul en vez de ámbar */
:root{--amb:#D9E8F6;--amb-b:#7AA6D1;--amb-t:#1D4466}
.preview{background:#1F1F1F;color:#fff;text-align:center;font-size:14px;font-weight:700;padding:8px 16px}
.topder{display:flex;align-items:center;gap:10px}
.btnAyuda{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 10px;border-radius:20px;border:1.5px solid #F2C879;background:#FBE3B5;font-size:15px;font-weight:800;color:#B45309;cursor:pointer;white-space:nowrap;flex:none}
.btnAyuda .ic{width:22px;height:22px;color:#B45309;stroke-width:2.4}
.titulo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.campo{display:flex;flex-direction:column;gap:8px}
.campo .opc{font-weight:500;color:var(--ink2)}
.sug.on{border:2.5px solid var(--ink);font-weight:800}
.valor .small b{color:var(--ink);font-weight:700}
.btnGasto{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:26px;border:2px solid var(--ink);background:var(--card);font-size:17px;font-weight:700;color:var(--ink);width:100%;cursor:pointer;padding:0 18px}
.btnGasto .ic{width:22px;height:22px;stroke-width:2.6}
.recuerda{font-size:14px;font-weight:500;font-style:italic;color:var(--ink3);line-height:1.35;margin-top:-6px}

:root{--morado:#7B5BD6;--barra:#5B3FB5}
#app,#app.flow{min-height:calc(100vh / var(--z,1))}

const iconoPara = nombre => { const n = (nombre||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); for(const [re,k] of PALABRAS) if(re.test(n)) return k; return "bolsa"; };
const iconoCuenta = n => { const s=(n||"").toLowerCase(); if(/luz|energ/.test(s))return"luz"; if(/agua/.test(s))return"gota"; if(/gas/.test(s))return"fuego"; if(/internet|wifi/.test(s))return"wifi"; if(/celu|telef/.test(s))return"telefono"; if(/carro|moto|cuota/.test(s))return"carro"; if(/admin|arriendo/.test(s))return"hogar"; return "cuentas"; };
const colorDe = b => b.otros ? ["#F4F1ED","#1F1F1F"] : b.aFavor ? ["#DCFCE7","#15803D"] : COLORES[(b.color ?? 0) % COLORES.length];
const sqB = (b, cls="", dot=false) => { const [bg,fg] = colorDe(b); return `<span class="sq ${cls}" style="background:${bg};color:${fg}">${ic(b.otros?"otros":(b.icono||iconoPara(b.nombre)))}${dot?'<span class="pt" aria-hidden="true"></span>':""}</span>`; };
const sqAhorro = (cls="") => `<span class="sq ${cls}" style="background:var(--ahorro-bg);color:var(--ahorro-i)">${ic("ahorro")}</span>`;

/* ---------- estado ---------- */
const S = { user:null, db:null, ok:false, mesListo:false, cfg:null, estado:null, ahorro:null, mes:null, mesKey:null, view:"inicio", p:{}, stack:[], toast:null, draft:null, meses:null, borr:null };
let unsubMes = null, unsubBorr = null;

/* ---------- cálculos ---------- */
const cuentasCfg = () => (S.cfg?.cuentas || []).filter(c => !c.archivada);
function cuentaMes(c){ // estado de una cuenta en el mes actual
  const st = (S.mes?.cuentas || {})[c.id] || {};
  const valor = st.valor ?? c.valor;
  const bimestral = c.cada === 2;
  const toca = bimestral ? !!st.toca : true;
  const apartado = bimestral ? Math.round(valor/2) : valor;
  return { ...c, valor, toca, apartado, pagada: !!st.pagada, fechaPago: st.fechaPago, verificada: !!st.verificada || !c.variable };
}
const cuentasMes = () => cuentasCfg().map(cuentaMes).sort((a,b)=>a.dia-b.dia);
const recibido = () => (S.mes?.ingresos || []).reduce((s,i)=>s+(+i.valor||0),0) + (S.mes?.desdeAhorro||0);
const apartado = () => cuentasMes().reduce((s,c)=>s+c.apartado,0);
const libre = () => recibido() - apartado();
const bolsillos = () => (S.mes?.bolsillos || []);
const gastos = () => (S.mes?.gastos || []);
const favorEn = id => gastos().filter(g=>g.bolsillo===id).reduce((s,g)=>s+(+g.favor||0),0);
const gastado = id => gastos().filter(g=>g.bolsillo===id).reduce((s,g)=>s+(+g.valor||0)-(+g.favor||0),0);
function asignado(b){ if(!b.otros) return +b.asignado||0; return libre() - bolsillos().filter(x=>!x.otros).reduce((s,x)=>s+(x.aFavor?-1:1)*(+x.asignado||0),0); }
const quedan = b => asignado(b) - gastado(b.id);
const ordenados = () => { const bs = bolsillos().filter(b=>!b.borrado); return [...bs.filter(b=>!b.otros), ...bs.filter(b=>b.otros)]; };
const estadoB = b => { if(b.aFavor) return ""; if(!b.otros && favorEn(b.id)>0 && quedan(b)<=0) return ""; const a=asignado(b), q=quedan(b); if(a>0 && q<=0) return "acabo"; if(a>0 && q<=a*0.2) return "casi"; return ""; };
const totalQuedan = () => ordenados().filter(b=>!b.aFavor).reduce((s,b)=>s+quedan(b),0);
function diaHoy(){ const d=hoy(); return mesKey(d)===S.mesKey ? d.getDate() : (mesKey(d) > S.mesKey ? diasMes(S.mesKey)+1 : 0); }
function clasif(c){ const dh = diaHoy(); if(c.pagada) return "pagada"; if(!c.toca) return "notoca"; if(c.dia < dh) return "vencida"; if(c.variable && !c.verificada && c.dia - dh <= 7) return "verificar"; return "proxima"; }
const necesitaCierre = () => S.mesKey && mesKey(hoy()) > S.mesKey;

/* ---------- próximo mes (borrador estimado) ---------- */
const sigKey = () => S.mesKey ? mesSig(S.mesKey) : null;
const DIA_PROXIMO = 20; // desde este día aparece "Lo que viene"
const verProximo = () => !!S.mesKey && !necesitaCierre() && diaHoy() >= DIA_PROXIMO;
const borr = () => (S.borr && S.borr.mes === sigKey()) ? S.borr : null;
function cuentaBorr(c){ // estado de una cuenta en el próximo mes
  const st = ((borr()||{}).cuentas || {})[c.id] || {}; const actual = (S.mes?.cuentas || {})[c.id] || {};
  const bimestral = c.cada === 2; const toca = bimestral ? !actual.toca : true;
  const valor = st.valor ?? c.valor;
  return { ...c, valor, toca, apartado: bimestral ? Math.round(valor/2) : valor, pagada: !!st.pagada, fechaPago: st.fechaPago, cambiada: !!st.cambiada || !c.variable };
}
const cuentasBorr = () => cuentasCfg().map(cuentaBorr).sort((a,b)=>a.dia-b.dia);
const borrIngresos = () => [ ...(S.cfg?.ingresosFijos||[]).map(i=>({ ...i, fijo:true, valor: ((borr()||{}).fijos||{})[i.id] ?? i.valor })), ...(((borr()||{}).extra)||[]).map(i=>({...i, fijo:false})) ];
const borrRecibe = () => borrIngresos().reduce((s,i)=>s+(+i.valor||0),0);
const borrApartar = () => cuentasBorr().reduce((s,c)=>s+c.apartado,0);
const borrLibre = () => borrRecibe() - borrApartar();
const cambioBorr = (mut, txt) => { const k = sigKey(); const prev = borr() ? clone(borr()) : null; const b = clone(borr()) || { mes:k, cuentas:{}, fijos:{}, extra:[] };
  b.cuentas = b.cuentas||{}; b.fijos = b.fijos||{}; b.extra = b.extra||[]; mut(b); S.borr = b; render(); return guardar([{ path:"borrador/"+k, data:b, prev }], txt); };

/* ---------- guardar con deshacer ---------- */
async function guardar(cambios, toastTxt){
  // cambios: [{path, data}] ; se guarda copia previa para Deshacer
  if(!S.db) return;
  const prev = cambios.map(c => ({ path:c.path, data: clone(c.prev) }));
  try {
    await Promise.all(cambios.map(c => S.db.doc(c.path).set(capNombres(clone(c.data)))));
    if(toastTxt) mostrarToast(toastTxt, prev);
  } catch(e){ mostrarToast("No se pudo guardar. Revisa tu conexión e intenta otra vez."); }
}
const cambioMes = (mut, txt) => { const prev = clone(S.mes); const m = clone(S.mes); mut(m); S.mes = m; render(); return guardar([{path:"meses/"+S.mesKey, data:m, prev}], txt); };
let toastTimer = null;
function mostrarToast(txt, prev){
  S.toast = { txt, prev }; renderToast();
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=null; renderToast(); }, prev ? 7000 : 4000);
}
async function deshacer(){
  const t = S.toast; if(!t?.prev) return; S.toast=null; renderToast();
  try { await Promise.all(t.prev.map(p => p.data ? S.db.doc(p.path).set(p.data) : S.db.doc(p.path).delete())); mostrarToast("Listo, se deshizo."); }
  catch(e){ mostrarToast("No se pudo deshacer. Intenta otra vez."); }
}
function renderToast(){
  let el = $("#toast"); if(el) el.remove();
  if(!S.toast) return;
  el = document.createElement("div"); el.id="toast"; el.className="toast"+(esFlujo()?" flow":""); el.setAttribute("role","status");
  el.innerHTML = `${ic("check",'style="width:22px;height:22px;stroke-width:2.6;color:#86EFAC"')}<span>${esc(S.toast.txt)}</span>${S.toast.prev?'<button data-act="deshacer">Deshacer</button>':""}`;
  document.body.appendChild(el);
}

/* ---------- navegación ---------- */
const TABS = ["inicio","cuentas","bolsillos","ajustes"];
const esFlujo = () => !TABS.includes(S.view) || S.view==="cierre";
function ir(view, p={}, reemplazar=false){ if(!reemplazar) S.stack.push({view:S.view,p:S.p}); S.view=view; S.p=p; render(); window.scrollTo(0,0); }
function volver(){ const x = S.stack.pop(); if(x){ S.view=x.view; S.p=x.p; } else { S.view="inicio"; S.p={}; } render(); window.scrollTo(0,0); }
function tab(v){ S.stack=[]; S.view=v; S.p={}; render(); window.scrollTo(0,0); }
const volverA = v => { // vuelve hasta la última pantalla v de la pila (o al tab)
  while(S.stack.length){ const x=S.stack.pop(); if(x.view===v){ S.view=x.view; S.p=x.p; render(); window.scrollTo(0,0); return; } }
  tab(TABS.includes(v)?v:"inicio");
};

function hojaAviso(){ const a=S.aviso; return `<div class="overlay"><section class="sheet aviso" role="alertdialog" aria-labelledby="avT"><img class="logoBanco" src="${LOGO_BC}" alt="Bancolombia"><h1 id="avT" class="h2" style="font-size:24px">No olvides actualizar Bancolombia</h1><p class="txt num">${a.texto} Actualiza tu bolsillo <b>${a.bolsillo}</b>.</p><button class="btn" data-act="cerrarAviso" style="margin-top:4px">Entendido</button></section></div>`; }
const btnGasto = `<button class="btnGasto" data-act="gastoDirecto">${ic("mas")}Anotar un gasto</button>`;
const backBtn = (txt="Atrás") => `<button class="back" data-act="volver">${ic("atras")}${esc(txt)}</button>`;
const cancelar = (act="volver") => `<button class="link" data-act="${act}">Cancelar</button>`;
const navTabs = () => { const pend = cuentasMes().some(c=>["vencida","verificar"].includes(clasif(c))); const t=(v,txt,i)=>`<button class="tab ${S.view===v?"on":""}" data-tab="${v}" ${S.view===v?'aria-current="page"':""}><span style="position:relative;display:flex">${ic(i)}${v==="cuentas"&&pend?'<span class="dot" aria-label="Hay facturas para atender"></span>':""}</span>${txt}</button>`; return `<div class="navbar"><nav class="tabs" aria-label="Secciones">${t("inicio","Inicio","inicio")}${t("cuentas","Facturas","cuentas")}${t("bolsillos","Bolsillos","bolsa")}${t("ajustes","Ajustes","ajustes")}</nav><button class="fabNav" data-act="gastoDirecto" aria-label="Anotar un gasto">${ic("mas")}<span>Gasto</span></button></div>`; };
const liBolsillo = (b) => { const fz = b.otros ? 0 : favorEn(b.id); if(fz>0 && quedan(b)<=0) return `<button class="item" data-act="verBolsillo" data-id="${b.id}">${sqB(b)}<span class="mid"><span class="t">${esc(b.nombre)}</span><span class="s" style="color:var(--ok);font-weight:600">Pagado</span></span><span class="rt"><span class="l" style="color:var(--ok)">A favor</span><span class="num v" style="color:var(--ok)">+${money(fz)}</span></span></button>`; if(b.aFavor) return `<button class="item" data-act="verBolsillo" data-id="${b.id}">${sqB(b)}<span class="mid"><span class="t">${esc(b.nombre)}</span><span class="s" style="color:var(--ok);font-weight:600">Saldo a favor</span></span><span class="rt"><span class="l" style="color:var(--ok)">A favor</span><span class="num v" style="color:var(--ok)">+${money(asignado(b))}</span></span></button>`; const e=estadoB(b); return `<button class="item" data-act="verBolsillo" data-id="${b.id}">${sqB(b,"",!!e)}<span class="mid"><span class="t">${esc(b.nombre)}</span>${e==="casi"?'<span class="s warn">Casi se acaba</span>':e==="acabo"?'<span class="s warn">Se acabó este mes</span>':b.otros?'<span class="s">Gastos sin bolsillo</span>':""}</span><span class="rt"><span class="l ${e?"warn":""}">${b.otros?"Libre":e==="casi"?"Solo quedan":"Quedan"}</span><span class="num v">${money(Math.max(0,quedan(b)))}</span></span></button>`; };
const separadoMes = () => apartado() + ordenados().filter(b=>!b.otros && !b.aFavor).reduce((s,b)=>s+asignado(b),0);
const heroLibre = () => { const o = ordenados().find(b=>b.otros); const Q = o ? quedan(o) : 0; const sep = separadoMes(); const rec = recibido(); const falta = Math.max(0, diasMes(S.mesKey) - Math.max(diaHoy(),1));
  const usado = cuentasMes().filter(c=>c.toca && c.pagada).reduce((s,c)=>s+c.valor,0) + ordenados().filter(b=>!b.otros && !b.aFavor).reduce((s,b)=>s+gastado(b.id),0); const pu = sep>0 ? Math.max(0,Math.min(100,Math.round(usado/sep*100))) : 0;
  return `<section class="hero lila"><span class="q">Separado en Bancolombia</span><div style="display:flex;flex-direction:column;gap:2px"><span class="num cifra">${money(sep)}</span><span style="font-size:16px;font-weight:600;color:#4A3A7A">Tus bolsillos FACTURAS + BOLSILLOS</span></div><div class="usado num"><span>Ya pagaste <b>${money(usado)}</b></span><span>${pu}%</span></div><div class="bar" aria-label="Ya pagaste el ${pu}% de lo separado"><i style="width:${pu}%"></i></div><div class="libreFila"><span ${Q<0?'style="color:var(--rojo-t)"':""}>${Q<0?"Te falta para cubrir tus bolsillos":"Te queda libre"}</span><b class="num" ${Q<0?'style="color:var(--rojo-t)"':""}>${money(Math.abs(Q))}</b></div><span style="font-size:16px;font-weight:500;color:var(--lila-t)">${falta===1?"Falta 1 día":"Faltan "+falta+" días"} · recibiste ${money(rec)}</span></section>`; };
function itemCuenta(c, conMarcar){
  const k = clasif(c);
  let bg="", sq="", sub="";
  if(k==="vencida"){ bg='style="background:var(--rojo-bg);border-color:transparent"'; sq=`<span class="sq" style="background:var(--rojo-sq);color:var(--rojo)">${ic("alerta",'style="width:26px;height:26px"')}</span>`; sub=`<span class="s" style="color:var(--rojo-t);font-weight:600">Venció el día ${c.dia}</span>`; }
  else if(k==="verificar"){ bg='style="background:var(--ver-bg);border-color:transparent"'; sq=`<span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic("recibo",'style="width:26px;height:26px"')}</span>`; sub=`<span class="s warn">Verifica el recibo · día ${c.dia}</span>`; }
  else if(k==="pagada"){ sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`; sub=`<span class="s" style="color:var(--ok);font-weight:600">✓✓ Pagada${c.fechaPago?" el "+Number(c.fechaPago.slice(8)):""}</span>`; }
  else if(k==="notoca"){ bg='style="background:transparent;border-style:dashed;border-color:#DCD6CF"'; sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`; sub=`<span class="s">Este mes no toca · apartando la mitad</span>`; }
  else { sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`; sub=`<span class="s">${c.dia===diaHoy()?"Vence hoy":c.dia===diaHoy()+1?"Vence mañana":"Vence el "+c.dia}</span>`; }
  const val = k==="notoca" ? c.apartado : c.valor;
  const mark = conMarcar && (k!=="pagada" && k!=="notoca") ? `<button class="mark" role="checkbox" aria-checked="false" data-act="pagar" data-id="${c.id}"><span class="box"></span>Marcar pagado</button>` : "";
  return `<div class="card" ${bg}><button class="row" data-act="verCuenta" data-id="${c.id}">${sq}<span class="mid"><span class="t">${esc(c.nombre)}</span>${sub}</span><span class="num v" ${k==="pagada"?'style="color:var(--ink2)"':""}>${money(val)}</span></button>${mark}</div>`;
}

function tarjetaProximo(){ if(!verProximo()) return ""; const k = sigKey(); const L = borrLibre();
  return `<div class="sec"><h2 class="h2">Lo que viene</h2>
  <button class="prox" data-act="proximo"><span class="prox-tag">${ic("calendario")}${cap(mesNombre(k))} · estimado</span>
    <span class="prox-fila"><span class="q">Vas a apartar para facturas</span><span class="num v">${money(borrApartar())}</span></span>
    <span class="prox-fila"><span class="q">Quedarían para tus bolsillos</span><span class="num v" ${L<0?'style="color:var(--rojo-t)"':""}>${money(L)}</span></span>
    <span class="prox-cta">Ver ${mesNombre(k)}${ic("sig")}</span></button></div>`; }
function itemBorr(c){ const k = sigKey(); let cls="", sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`, sub="", val=c.valor, tap=true;
  if(!c.toca){ cls="pre"; sub=`<span class="s">No toca en ${mesNombre(k)} · apartando la mitad</span>`; val=c.apartado; tap=false; }
  else if(c.pagada){ sub=`<span class="s" style="color:var(--ok);font-weight:600">✓✓ Ya la pagaste${c.fechaPago?" el "+Number(c.fechaPago.slice(8))+" "+fechaDe(c.fechaPago):""}</span>`; }
  else if(!c.cambiada){ cls="pre"; sq=`<span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic("recibo",'style="width:26px;height:26px"')}</span>`; sub=`<span class="s warn">Valor de ${mesNombre(S.mesKey)} · verifica el real</span>`; }

  ${campo("¿De qué bolsillo?", `<div class="chips" role="group" aria-label="Bolsillos">${bs.map(x=>{const e=estadoB(x);return `<button class="chip ${x.id===p.bolsillo?"on":""}" aria-pressed="${x.id===p.bolsillo}" data-act="chipB" data-id="${x.id}">${sqB(x,"",!!e)}<span>${esc(x.nombre)}</span></button>`}).join("")}</div><span class="small">Si no tiene bolsillo, usa Libre.</span>`)}
  ${b?campo(`¿En qué fue? <span class="opc">(opcional)</span>`, inpTexto("nota","nota",p.nota,"Escríbelo aquí") + (edit?"":ideas(ideasGasto(b),"nota",p.nota)), "nota"):""}
  ${campo("¿Cuánto gastaste?", cajaValor("monto", p.monto, b?`${edit&&ant?`Antes: ${money(ant.valor)} · `:""}Te quedarán <b>${money(q-(p.monto||0))}</b> en ${esc(b.nombre)}`:"Primero escoge el bolsillo"))}
  ${pieForm("guardarGasto", edit?"Guardar":"Anotar gasto", b && p.monto>0, edit && "borrarGasto", "Borrar gasto")}`; };
function hojaNoAlcanza(){ const p=S.p; const b=bolsillos().find(x=>x.id===p.bolsillo); const falta=p.falta; const opciones = ordenados().filter(x=>!x.aFavor && x.id!==b.id && quedan(x)>=falta).sort((a,c)=>(c.otros?1:0)-(a.otros?1:0)||quedan(c)-quedan(a)); const ah=(S.ahorro?.saldo||0)>=falta; if(p.origen==null) p.origen = opciones[0]?.id || (ah?"ahorro":null);
  const nom = p.origen==="ahorro"?"tu Ahorro":esc(bolsillos().find(x=>x.id===p.origen)?.nombre||"");
  return `<div class="overlay" data-act="cerrarHoja"><section class="sheet" role="dialog" aria-labelledby="na" data-stop><span class="grab" aria-hidden="true"></span>
  <span class="num txt">A ${esc(b.nombre)} solo le quedan ${money(Math.max(0,p.quedaba))}</span><h1 id="na" class="h2" style="font-size:24px">Te faltan ${money(falta)}. ¿De dónde los sacamos?</h1>
  <div role="radiogroup" style="display:flex;flex-direction:column;gap:8px">${opciones.slice(0,4).map(x=>`<button class="opt ${p.origen===x.id?"on":""}" role="radio" aria-checked="${p.origen===x.id}" data-act="naOrigen" data-id="${x.id}"><span class="radio"></span>${sqB(x,"s")}<span class="grow">${esc(x.nombre)}</span><span class="rt"><span class="l">Quedan</span><span class="num" style="font-size:18px;font-weight:600">${money(quedan(x))}</span></span></button>`).join("")}${ah?`<button class="opt ${p.origen==="ahorro"?"on":""}" role="radio" aria-checked="${p.origen==="ahorro"}" data-act="naOrigen" data-id="ahorro"><span class="radio"></span>${sqAhorro("s")}<span class="grow">Ahorro</span><span class="rt"><span class="l">Tienes</span><span class="num" style="font-size:18px;font-weight:600">${money(S.ahorro.saldo)}</span></span></button>`:""}</div>
  ${!p.origen?`<p class="small">No hay ningún bolsillo con ${money(falta)}. Cambia el valor del gasto o agrega un ingreso.</p>`:""}
  ${!b.otros?`<button class="opt" data-act="naCruce" style="min-height:72px;margin-top:4px"><span class="sq s" style="background:#DCFCE7;color:#15803D">${ic("check")}</span><span>Dejar el saldo a favor<small>${esc(b.nombre)} queda en $0 y los ${money(falta)} de más quedan a favor en Libre.</small></span></button>`:""}<div style="display:flex;flex-direction:column;gap:4px"><button class="btn" data-act="naConfirmar" ${p.origen?"":"disabled"}>${p.origen?"Sacar de "+nom:"Sacar de otro bolsillo"}</button><button class="btn3" data-act="cerrarHoja">Cambiar el valor del gasto</button></div></section></div>`; }

/* agregar / cambiar ingreso (solo desde Ajustes > Ingresos) */
V.ingreso = () => { const p=S.p; const edit=!!p.editId; const ok = !!String(p.nombre||"").trim() && p.monto>0;

/* valor de una cuenta (verificar recibo / cambiar valor del mes) */
V.valorCuenta = () => { const c = cuentaMes(cuentasCfg().find(x=>x.id===S.p.id)); const k=clasif(c);
  return `<div class="top">${backBtn()}</div>
  ${k==="verificar"?`<section style="background:var(--ver-bg);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px"><span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic(iconoCuenta(c.nombre))}</span><span class="mid"><span class="h2">${esc(c.nombre)}</span><span class="s warn">Verifica el recibo · se paga el día ${c.dia}</span></span></section>`:`<div><h1 class="h1">${esc(c.nombre)}</h1><span class="txt">Se paga el día ${c.dia}</span></div>`}
  <span class="q" style="margin-top:4px">¿Cuánto llegó el recibo?</span>
  <section class="valor"><input id="monto" class="num cifra montoInp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" value="${S.p.monto?money(S.p.monto):""}" placeholder="$0" data-field="monto" data-money aria-label="Valor"><span class="num small">${S.p.monto===c.valor?"Es el valor del mes pasado":"El mes pasado fue "+money(c.valor)}</span></section>
  
  <div class="bottom"><span class="small" style="text-align:center">El próximo mes te sugerimos este mismo valor.</span><button class="btn" data-act="guardarValorCuenta" ${S.p.monto>0?"":"disabled"}>Guardar</button>
  ${!c.pagada && c.toca?`<button class="btn3" data-act="pagarDesdeValor">Guardar y marcar pagado</button>`:""}</div>`; };

/* detalle de bolsillo */
V.bolsilloFavor = b => `<div class="top">${backBtn("Atrás")}</div>
  <div class="top"><div style="display:flex;align-items:center;gap:12px;min-width:0"><span class="sq" style="width:56px;height:56px;border-radius:16px;background:#DCFCE7;color:#15803D">${ic(b.icono||iconoPara(b.nombre),'style="width:28px;height:28px"')}</span><h1 class="mes" style="overflow-wrap:anywhere">${esc(b.nombre)}</h1></div><button class="link" data-act="renombrar" aria-label="Cambiar saldo a favor" style="width:44px;justify-content:center;color:var(--ink3)">${ic("pen",'style="width:22px;height:22px"')}</button></div>
  <section class="resumen"><span class="r-lbl">Saldo a favor</span><span class="num r-cifra" style="color:var(--ok)">+${money(asignado(b))}</span></section>
  <p class="small">Se suma a tu plata libre. No se gasta desde aquí.</p>`;
V.bolsillo = () => { const b = bolsillos().find(x=>x.id===S.p.id); if(!b) return V.bolsillos(); if(b.aFavor) return V.bolsilloFavor(b); const e=estadoB(b); const a=asignado(b), g=gastado(b.id), q=a-g;
  const gs = gastos().filter(x=>x.bolsillo===b.id).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  return `<div class="top">${backBtn("Atrás")}</div>
  <div class="top">${`<div style="display:flex;align-items:center;gap:12px;min-width:0">${(()=>{const [bg,fg]=colorDe(b);return `<span class="sq" style="width:56px;height:56px;border-radius:16px;background:${bg};color:${fg}">${ic(b.otros?"otros":(b.icono||iconoPara(b.nombre)),'style="width:28px;height:28px"')}${e?'<span class="pt" style="width:16px;height:16px;border-color:var(--bg)"></span>':""}</span>`})()}<h1 class="mes" style="overflow-wrap:anywhere">${esc(b.nombre)}</h1></div>`}${b.otros?"":`<button class="link" data-act="renombrar" aria-label="Cambiar bolsillo" style="width:44px;justify-content:center;color:var(--ink3)">${ic("pen",'style="width:22px;height:22px"')}</button>`}</div>
  ${b.otros?`<p class="small" style="margin-top:-8px">Para gastos que no tienen bolsillo.</p>`:""}
  <section style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:16px 22px;display:flex;flex-direction:column;gap:8px">${(()=>{ const fz = b.otros ? 0 : favorEn(b.id); return fz>0 && q<=0 ? `<span class="q" style="color:var(--ok)">A favor</span><span class="num cifra" style="color:var(--ok)">+${money(fz)}</span>` : `<span class="q ${e?"warn":""}">${b.otros?"Te queda libre":e==="casi"?"Solo quedan":"Quedan"}</span><span class="num cifra">${money(Math.max(0,q))}</span>`; })()}<div class="bar gris" aria-hidden="true"><i style="width:${a>0?Math.max(0,Math.min(100,Math.round(q/a*100))):0}%"></i></div><span class="num txt">Tenías ${money(a)} · Has gastado ${money(g)}</span></section>
  <button class="btn2" data-act="pasar">${ic("mas",'style="stroke-width:2.4"')}Pasar plata a este bolsillo</button>
  <div class="sec" style="gap:8px"><h2 class="h2">Lo que gastaste</h2>${gs.length?`<span class="small">Toca un gasto para cambiarlo.</span><div class="grp">${gs.map(x=>`<button class="li" data-act="editarGasto" data-id="${x.id}"><span class="n"><b ${x.nota?"":'style="color:var(--ink2)"'}>${x.nota?esc(x.nota):"Sin nombre"}</b><small>${fechaLarga(x.fecha)} ${fechaDe(x.fecha)}</small>${x.favor?`<small style="color:var(--ok);font-weight:600">+${money(x.favor)} a favor en Libre</small>`:""}</span><span class="num lv">${money(x.valor)}</span>${ic("pen",'class="ic pen"')}</button>`).join("")}</div>`:`<div class="empty"><p class="small">Todavía no has gastado de este bolsillo este mes.</p></div>`}</div>
  <div class="bottom"><button class="btn" data-act="gastoEn">Anotar gasto en ${esc(b.nombre)}</button><button class="btn2" data-tab="bolsillos">Ver todos los bolsillos</button></div>`; };
function hojaBorrar(){ const b=bolsillos().find(x=>x.id===S.p.id); const q=Math.max(0,quedan(b)); return `<div class="overlay" data-act="cerrarHoja"><section class="sheet" role="alertdialog" aria-labelledby="bt" data-stop><span class="grab" aria-hidden="true"></span><span class="sq" style="width:52px;height:52px;border-radius:16px;background:rgba(220,38,38,.12);color:var(--rojo);margin-top:6px">${ic("caneca",'style="width:28px;height:28px"')}</span><h1 id="bt" class="h2" style="font-size:24px">¿Seguro que quieres borrar ${esc(b.nombre)}?</h1><p class="txt" style="font-size:17px">${b.aFavor?`Tu plata libre baja <b class="num" style="color:var(--ink);font-weight:600">${money(asignado(b))}</b>.`:`Los <b class="num" style="color:var(--ink);font-weight:600">${money(q)}</b> que quedan pasan a Libre. Lo que ya gastaste queda guardado en este mes.`}</p><div style="display:flex;flex-direction:column;gap:12px;margin-top:6px"><button class="btn rojo" data-act="confirmarBorrar">Sí, borrar bolsillo</button><button class="btn2" data-act="cerrarHoja">No, dejarlo</button></div></section></div>`; }

/* pasar plata */
function origenes(destId){ return ordenados().filter(x=>!x.aFavor && x.id!==destId); }
V.pasar = () => { const p=S.p; const d=bolsillos().find(x=>x.id===p.destino); if(p.origen==null){ const os=origenes(d.id).filter(x=>quedan(x)>0).sort((a,c)=>(c.otros?1:0)-(a.otros?1:0)||quedan(c)-quedan(a)); p.origen = os[0]?.id || ((S.ahorro?.saldo||0)>0?"ahorro":null); }
  const o = p.origen==="ahorro"?{nombre:"Ahorro",ahorro:true}:bolsillos().find(x=>x.id===p.origen); const disp = o? (o.ahorro?(S.ahorro?.saldo||0):quedan(o)) : 0; const m=p.monto||0;
  return `<div class="top cab">${btnCerrar()}<h1 class="h1">Pasar plata a ${esc(d.nombre)}</h1></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="q">Sale de</span>${o?`<button class="item" data-act="escogerOrigen" style="min-height:64px">${o.ahorro?sqAhorro("s"):sqB(o,"s")}<span class="mid"><span class="t" style="font-size:17px">${esc(o.nombre)}</span><span class="num s">${o.ahorro?"Tienes":"Quedan"} ${money(disp)}</span></span><span style="font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:3px">Cambiar</span></button>`:`<div class="empty"><p class="small">Ningún bolsillo tiene plata para pasar.</p></div>`}</div>
  <section class="valor" style="gap:12px"><div><span style="font-size:15px;font-weight:600;color:var(--ink2)">¿Cuánto pasas?</span><input id="monto" class="num cifra montoInp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" value="${S.p.monto?money(S.p.monto):""}" placeholder="$0" data-field="monto" data-money aria-label="Valor"></div>${o?`<div style="display:flex;flex-direction:column;gap:8px;border-top:1.5px solid var(--line);padding-top:12px;width:100%;text-align:left">${[[o, disp-m],[d, quedan(d)+m]].map(([x,v])=>`<span style="display:flex;align-items:center;gap:10px;font-size:16px">${x.ahorro?sqAhorro("xs"):sqB(x,"xs")}<span class="grow">${esc(x.nombre)} quedará con</span><b class="num" style="font-weight:600;${v<0?"color:var(--rojo-t)":""}">${money(v)}</b></span>`).join("")}</div>`:""}</section>
  ${m>disp&&o?`<p class="small" style="color:var(--rojo-t);font-weight:600;text-align:center">${esc(o.nombre)} solo tiene ${money(disp)}.</p>`:""}
  <div class="bottom"><button class="btn" data-act="confirmarPasar" ${o&&m>0&&m<=disp?"":"disabled"}>Pasar la plata</button></div>`; };
V.pasarOrigen = () => { const p=S.p; return `<div class="top">${backBtn()}</div><h1 class="h1">¿De dónde sacas la plata?</h1>
  <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">${origenes(p.destino).map(x=>{const q=quedan(x);return `<button class="opt ${p.origen===x.id?"on":""}" role="radio" aria-checked="${p.origen===x.id}" data-act="setOrigen" data-id="${x.id}" ${q>0?"":"disabled"}><span class="radio"></span>${sqB(x,"s")}<span class="grow">${esc(x.nombre)}</span><span class="rt"><span class="l">${q>0?"Quedan":"No tiene"}</span><span class="num" style="font-size:18px;font-weight:600">${money(Math.max(0,q))}</span></span></button>`}).join("")}
  <button class="opt ${p.origen==="ahorro"?"on":""}" role="radio" aria-checked="${p.origen==="ahorro"}" data-act="setOrigen" data-id="ahorro" ${(S.ahorro?.saldo||0)>0?"":"disabled"}><span class="radio"></span>${sqAhorro("s")}<span class="grow">Ahorro</span><span class="rt"><span class="l">Tienes</span><span class="num" style="font-size:18px;font-weight:600">${money(S.ahorro?.saldo||0)}</span></span></button></div>
  <div class="bottom"><button class="btn" data-act="volver">Listo</button></div>`; };

/* agregar / cambiar bolsillo */
V.bolsilloForm = () => { const p=S.p; const edit=!!p.editId; const b = edit ? bolsillos().find(x=>x.id===p.editId) : null; if(edit && !b) return V.bolsillos();
  const otros = bolsillos().find(x=>x.otros); const fv = edit ? !!b.aFavor : !!p.aFavor; const m=p.monto||0; const antes = edit ? (+b.asignado||0) : 0;
  const disp = (otros?quedan(otros):0) + (fv?-antes:antes);
  const nota = fv ? `Tendrás <b>${money(disp+m)}</b> libres` : (disp-m>=0 ? `${edit&&gastado(b.id)>0?`Ya gastaste ${money(gastado(b.id))} · `:""}Te quedarán <b>${money(disp-m)}</b> libres` : `<span style="color:var(--rojo-t);font-weight:600">Te faltan ${money(m-disp)} para cubrir tus bolsillos</span>`);
  const ok = !!String(p.nombre||"").trim() && (!fv || m>0);
  return `${cabForm(edit?(fv?"Cambiar saldo a favor":"Cambiar bolsillo"):"Agregar bolsillo")}
  ${campo("¿Cómo se llama?", inpTexto("nombreB","nombre",p.nombre,"Ej.: Mercado",22) + (edit?"":ideas(IDEAS.map(x=>x[0]),"nombre",p.nombre)), "nombreB")}
  ${campo(fv?"¿De cuánto es el saldo a favor?":"¿Cuánto le pones este mes?", cajaValor("monto", m, nota))}
  ${edit?"":`<button class="opt ${fv?"on":""}" role="checkbox" aria-checked="${fv}" data-act="tipoB" style="min-height:56px"><span class="box" ${fv?'style="background:var(--ink)"':""}>${fv?ic("check",'style="width:18px;height:18px;color:#fff;stroke-width:3"'):""}</span><span>Es saldo a favor</span></button>`}
  ${pieForm("guardarB", edit?"Guardar":"Agregar bolsillo", ok, edit && "borrarB", fv?"Borrar saldo a favor":"Borrar bolsillo")}`; };
const nextColor = () => { const usados = bolsillos().filter(b=>!b.otros&&!b.borrado).map(b=>(b.color||0)%6); const cnt=[0,1,2,3,4,5].map(c=>usados.filter(u=>u===c).length); const min=Math.min(...cnt); const ult=usados[usados.length-1]; const op=[0,1,2,3,4,5].filter(c=>cnt[c]===min); return op.find(c=>c!==ult) ?? op[0]; };

/* cierre e inicio de mes */
function resumenMes(){ const sob = totalQuedan(); return { recibido: recibido(), sobrante: sob }; }

  <div style="background:rgba(255,255,255,.75);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px">${sqAhorro("s")}<span class="num" style="flex:1;font-size:16px;line-height:1.35">${sob>=0?`Los guardamos en tu Ahorro. Ahora tienes <b style="font-weight:600">${money(nuevo)}</b>.`:`Los sacamos de tu Ahorro. Ahora tienes <b style="font-weight:600">${money(Math.max(0,nuevo))}</b>.`}</span></div></section>
  <section style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:12px"><span class="h2">Empieza ${mesNombre(sig)}</span><span class="txt" style="font-size:17px">Son 3 pasos cortos: tu plata, tus facturas y tus bolsillos.</span><button class="btn" data-act="empezarMes">Empezar ${mesNombre(sig)}</button></section>`; };
const pasos = n => `<div class="steps" role="img" aria-label="Paso ${n} de 3">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><span class="lbl">Paso ${n} de 3</span>`;
V.paso1 = () => { const D=S.draft; const tot = D.ingresos.reduce((s,i)=>s+i.valor,0); const pend = D.ingresos.filter(i=>i.variable && !i.verificado);
  return `<div style="display:flex;flex-direction:column;gap:10px">${backBtn("Volver al inicio")}${pasos(1)}</div>
  <h1 class="mes" style="margin-top:6px">Empecemos ${mesNombre(D.mes)}</h1><p style="font-size:20px">¿Este mes recibiste esta plata?</p>
  <section style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:16px"><span class="num cifra">${money(tot)}</span>${D.ingresos.map((i,ix)=>{ const pe = i.variable && !i.verificado; return `<button class="row" data-act="p1valor" data-ix="${ix}" style="border-top:1.5px solid var(--line);padding-top:14px${pe?";background:var(--ver-bg);border-radius:16px;padding:12px 10px;border-top-color:transparent":""}">${pe?`<span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic("recibo")}</span>`:`<span class="sq">${ic("persona")}</span>`}<span class="mid"><span class="t">${esc(i.nombre)}</span>${pe?`<span class="s warn">Verifica cuánto te llegó</span>`:`<span class="s">${i.variable?"Todos los meses · el valor cambia":"Todos los meses"}</span>`}</span><span class="num v">${money(i.valor)}</span>${ic("pen",'class="ic pen"')}</button>`; }).join("")}${D.extra.map(i=>`<div class="row" style="border-top:1.5px solid var(--line);padding-top:14px;cursor:default"><span class="sq">${ic("billete")}</span><span class="mid"><span class="t">${esc(i.nombre||"Otro ingreso")}</span><span class="s">Solo este mes</span></span><span class="num v">${money(i.valor)}</span></div>`).join("")}</section>

/* ---------- actualizar sin cerrar el teclado ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType || a.nodeName!==b.nodeName){ a.replaceWith(b); return; }
  if(a.nodeType===3){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  if(a.nodeType!==1 || a===document.activeElement) return;
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value);
  morphKids(a,b);
}
function morphKids(a,b){ const ac=[...a.childNodes], bc=[...b.childNodes];
  bc.forEach((n,i)=>{ if(i<ac.length) morph(ac[i],n); else a.appendChild(n); });
  for(let i=bc.length;i<ac.length;i++) ac[i].remove(); }
function render(){
  const app = $("#app"), layer = $("#layer");
  if(!S.ok || S.cargar){ return; }
  if(S.mesKey && !S.mesListo){ return; }
  if(!S.mes){ app.className=""; app.innerHTML = `${HEADER}<div class="empty"><p class="q">Todavía no hay un mes cargado</p><p class="small">Daniela está preparando tus facturas y bolsillos. Cuando estén listos, aquí vas a ver tus facturas y tus bolsillos.</p></div>`; layer.innerHTML=""; return; }
  const needL = bs => (bs||[]).some(b=>b && b.otros && b.nombre!=="Libre"); const fixL = bs => (bs||[]).forEach(b=>{ if(b && b.otros) b.nombre="Libre"; });
  if(needL(S.mes.bolsillos)){ S.mes = clone(S.mes); fixL(S.mes.bolsillos); }
  if(S.meses && S.meses.some(m=>needL(m.bolsillos))) S.meses = S.meses.map(m=>{ if(!needL(m.bolsillos)) return m; const c = clone(m); fixL(c.bolsillos); return c; });
  if(S.draft && needL(S.draft.bolsillos)){ S.draft.bolsillos = clone(S.draft.bolsillos); fixL(S.draft.bolsillos); }
  let v = S.view; let hoja = "";
  if(v==="menu"){ hoja = hojaMenu(); v = S.p.base||"inicio"; }
  if(v==="noAlcanza"){ hoja = hojaNoAlcanza(); v="gasto"; }
  if(v==="borrar"){ hoja = hojaBorrar(); v=S.p.vistaBase||"bolsillo"; }
  if(v==="inicio" && necesitaCierre()) v = "cierre";
  const fn = V[v] || V.inicio;
  app.className = (TABS.includes(v)) ? "" : "flow";
  const act = document.activeElement; const html = fn();
  if(act && act.tagName==="INPUT" && app.contains(act) && app.dataset.v===v){ const t=document.createElement("div"); t.innerHTML=html; morphKids(app,t); }
  else { app.innerHTML = html; const f = app.querySelector("[autofocus]"); if(f) f.focus(); }
  app.dataset.v = v;
  if(!hoja && S.aviso) hoja = hojaAviso();
  layer.innerHTML = hoja;
  renderToast();
  ajustarBottom();
}
function ajustarBottom(){ const b=document.querySelector("#app.flow .bottom"); if(!b) return; const fin = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2; b.classList.toggle("flota", !fin); }
window.addEventListener("scroll", ajustarBottom, {passive:true}); window.addEventListener("resize", ajustarBottom);

  const disp = quedan(b) + (ant && ant.bolsillo===b.id ? +ant.valor : 0);
  if(p.monto > disp && !p.cubierto && !p.cruce && ant && ant.favor && !b.otros) p.cruce = true;
  if(p.monto > disp && !p.cubierto && !p.cruce){ S.p.falta = p.monto - Math.max(0,disp); S.p.quedaba = disp; S.p.origen = null; S.view="noAlcanza"; render(); return; }
  const favor = p.cruce ? Math.max(0, p.monto - Math.max(0,disp)) : 0;
  const nota = (p.nota||"").trim();
  const avisar = !p.editId && !b.otros; const id = p.editId || uid(); const fecha = ant?.fecha || ymd(hoy());
  cambioMes(m => { m.gastos = (m.gastos||[]).filter(g=>g.id!==id); m.gastos.push({id, bolsillo:b.id, valor:p.monto, fecha, nota, ...(favor?{favor}:{})}); if(p.cubierto && p.cubierto!=="ahorro"){ const o=m.bolsillos.find(x=>x.id===p.cubierto); const d=m.bolsillos.find(x=>x.id===b.id); if(!o.otros) o.asignado -= p.falta; if(!d.otros) d.asignado += p.falta; } }, avisar ? null : (favor ? (p.editId?"Gasto cambiado. ":"Gasto agregado. ")+money(favor)+" quedaron a favor en Libre." : (p.editId?"Gasto cambiado":"Gasto agregado en "+b.nombre)));
  if(p.cubierto==="ahorro"){ moverDesdeAhorro(b.id, p.falta); }
  volver();

};

window.addEventListener("popstate", () => {
  if(saliendo) return;
  if(S.aviso){ guardia(); A.cerrarAviso(); return; }
  if(["menu","noAlcanza","borrar"].includes(S.view)){ guardia(); A.cerrarHoja(); return; }

  if(S.stack.length){ guardia(); volver(); return; }

  const cerrado = clone(S.mes); cerrado.cerrado=true; cerrado.resumen={ recibido:r.recibido, sobrante:r.sobrante, cuentas: cuentasMes().map(c=>({nombre:c.nombre,valor:c.valor,apartado:c.apartado,toca:c.toca,pagada:c.pagada,fechaPago:c.fechaPago||null})) };
  cerrado.bolsillos = cerrado.bolsillos.map(b=>({...b, asignadoFinal: asignado(b)}));
  const a=clone(S.ahorro)||{saldo:0,movimientos:[]}; a.saldo=(a.saldo||0)+r.sobrante; a.movimientos=[...(a.movimientos||[]),{fecha:ymd(hoy()),valor:r.sobrante,motivo:(r.sobrante>=0?"Sobró en ":"Faltó en ")+mesNombre(S.mesKey)}].slice(-60);
  const cfg=clone(S.cfg); cfg.ingresosFijos=D.ingresos.map(i=>({id:i.id,nombre:i.nombre,valor:i.valor, ...(i.variable?{variable:true}:{})})); cfg.cuentas.forEach(c=>{ if(D.cuentas[c.id]) c.valor=D.cuentas[c.id].valor; });
  const nuevo = { mes:D.mes, ingresos:[...D.ingresos.map(i=>({id:uid(),nombre:i.nombre,valor:i.valor,fecha:D.mes+"-01",fijo:true,fijoId:i.id})), ...D.extra.map(i=>({id:uid(),nombre:i.nombre,valor:i.valor,fecha:D.mes+"-01",fijo:false}))],
    cuentas:Object.fromEntries(Object.entries(D.cuentas).map(([id,c])=>[id,{valor:c.valor,toca:c.toca,verificada:!!c.cambiada, ...(c.pagada?{pagada:true,fechaPago:c.fechaPago||null}:{})}])), bolsillos:D.bolsillos.map(b=>({...b})), gastos:[], desdeAhorro:0 };
  if(!nuevo.bolsillos.some(b=>b.otros)) nuevo.bolsillos.push({id:"otros",nombre:"Libre",otros:true,asignado:0});
  try { await Promise.all([ S.db.doc("meses/"+S.mesKey).set(cerrado), S.db.doc("meses/"+D.mes).set(nuevo), S.db.doc("ahorro/main").set(a), S.db.doc("config/main").set(cfg) ]);
    await S.db.doc("estado/main").set({mesActual:D.mes}); try{ await S.db.doc("borrador/"+D.mes).delete(); }catch(e){} S.borr=null; S.draft=null; S.stack=[]; S.view="inicio"; S.p={}; S.meses=null; mostrarToast("¡Listo! Empezaste "+mesNombre(D.mes)+".");
  } catch(e){ mostrarToast("No se pudo empezar el mes. Revisa tu conexión e intenta otra vez."); } };

/* ajustes */
A.recibo = () => ir("recibo"); A.misCuentas = () => ir("misCuentas"); A.meses = () => { ir("meses"); cargarMeses(); };
A.editIngFijo = el => { const i=S.cfg.ingresosFijos.find(x=>x.id===el.dataset.id); if(!i) return; ir("ingreso",{editId:i.id, id:i.id, origen:"fijo", nombre:i.nombre, monto:i.valor, tipo:"fijo", variable:!!i.variable}); };
A.editCuenta = el => { const id=el.dataset.id; const c=id?S.cfg.cuentas.find(x=>x.id===id):null; const toca = c ? !!((S.mes.cuentas||{})[c.id]||{}).toca : false;
  ir("cuenta",{id, f: c?{nombre:c.nombre,valor:c.valor,dia:c.dia,variable:!!c.variable,cada:c.cada||1,toca}:{nombre:"",valor:0,dia:"",variable:false,cada:1,toca:true}}); };
A.campoCuenta = el => { S.p.f[el.dataset.c] = JSON.parse(el.dataset.v); render(); };
A.guardarCuenta = () => { const p=S.p, f=p.f; const dia=parseInt(f.dia,10);
  if(!String(f.nombre||"").trim() || !(f.valor>0) || !(dia>=1&&dia<=31)) return;
  const prevC=clone(S.cfg), c=clone(S.cfg); const id=p.id||uid(); const datos={id,nombre:cap(f.nombre.trim()),valor:f.valor,dia,variable:!!f.variable,cada:f.cada};
  const ix=c.cuentas.findIndex(x=>x.id===id); if(ix>=0) c.cuentas[ix]={...c.cuentas[ix],...datos}; else c.cuentas.push(datos); S.cfg=c;
  const prevM=clone(S.mes), m=clone(S.mes); m.cuentas=m.cuentas||{}; m.cuentas[id]={...(m.cuentas[id]||{}), valor:f.valor, toca: f.cada===2?!!f.toca:true}; S.mes=m;
  guardar([{path:"config/main",data:c,prev:prevC},{path:"meses/"+S.mesKey,data:m,prev:prevM}], p.id?"Cambios guardados":null); volver(); if(!p.id){ const ap = datos.cada===2 ? Math.round(datos.valor/2) : datos.valor; S.aviso = {texto:`Agregaste la factura ${esc(datos.nombre)}. Cada mes apartas <b>${money(ap)}</b>.`, bolsillo:"FACTURAS"}; render(); } };
A.archivar = () => { const id=S.p.id; const prevC=clone(S.cfg), c=clone(S.cfg); c.cuentas.find(x=>x.id===id).archivada=true; S.cfg=c; guardar([{path:"config/main",data:c,prev:prevC}],"Factura guardada en Facturas que ya no pagas"); volver(); };
A.desarchivar = el => { const id=el.dataset.id; const prevC=clone(S.cfg), c=clone(S.cfg); delete c.cuentas.find(x=>x.id===id).archivada; S.cfg=c; render(); guardar([{path:"config/main",data:c,prev:prevC}],"La factura volvió a tus facturas"); };
A.texto = () => ir("texto");
A.setTamano = el => { const v=el.dataset.v; try { localStorage.setItem(TAM_KEY, v); } catch(e){} aplicarTamano(v); render(); };
A.avisos = () => ir("avisos",{f:{correo:S.cfg?.avisos?.correo||""}});
A.avisoCuando = el => { S.p.f.cuando=el.dataset.v; render(); };
A.guardarAvisos = () => { const prevC=clone(S.cfg), c=clone(S.cfg); c.avisos={...(c.avisos||{}), correo:(S.p.f.correo||"").trim()}; S.cfg=c; guardar([{path:"config/main",data:c,prev:prevC}],"Avisos guardados"); volver(); };
A.verMes = el => ir("mes",{id:el.dataset.id});
async function cargarMeses(){ try{ const snap=await S.db.collection("meses").get(); S.meses = snap.docs.map(d=>({key:d.id,...capNombres(clone(d.data()))})).filter(m=>m.cerrado).sort((a,b)=>b.key.localeCompare(a.key)); }catch(e){ S.meses=[]; } if(S.view==="meses") render(); }

/* ---------- eventos ---------- */
document.addEventListener("keydown", e => { const t=e.target; if(t && t.tagName==="INPUT" && (e.key==="Enter" || e.keyCode===13)){ e.preventDefault(); t.blur(); } });
/* Teclado: tocar afuera lo cierra. En iPhone, al cerrarse el teclado la pantalla se mueve y el toque
   puede caer sobre otro elemento (por ejemplo la caja del valor, que lo volvía a abrir). Por eso,
   si el toque cerró el teclado, se ignora el clic que llega después. */
const ACCIONABLE = "[data-act],[data-tab],[data-key],button,input,label,.valor";
let toqueCerroTeclado = false, toqueObjetivo = null, toqueHora = 0, toqueCierre = -1;
document.addEventListener("pointerdown", e => { const a=document.activeElement; toqueObjetivo = e.target.closest(ACCIONABLE); toqueHora = Date.now(); toqueCerroTeclado = false;
  if(a && a.tagName==="INPUT" && !e.target.closest("input, .valor")){ toqueCerroTeclado = true; toqueCierre = toqueHora; a.blur(); } }, true);
document.addEventListener("focusin", e => { const el=e.target; if(el && el.tagName==="INPUT" && Date.now()-toqueHora < 1000 && toqueCierre===toqueHora && el.closest(ACCIONABLE)!==toqueObjetivo && el!==toqueObjetivo){ el.blur(); } }, true);
document.addEventListener("click", e => { if(!toqueCerroTeclado) return; toqueCerroTeclado = false;
  const obj = e.target.closest(ACCIONABLE); if(Date.now()-toqueHora < 1500 && obj !== toqueObjetivo){ e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener("click", e => { const v=e.target.closest(".valor"); if(v && !e.target.closest("input")){ const i=v.querySelector("input"); if(i) i.focus(); } });
document.addEventListener("click", e => {
  const stop = e.target.closest("[data-stop]"); const el = e.target.closest("[data-act],[data-tab],[data-key]");
  if(!el){ return; }
  if(el.classList.contains("overlay") && stop) return; // clic dentro de la hoja
  if(el.dataset.key){ tecla(el.dataset.key); return; }
  if(el.dataset.tab){ tab(el.dataset.tab); return; }
  const f = A[el.dataset.act]; if(f) f(el);
});
document.addEventListener("input", e => { const el=e.target; const k=el.dataset.field; if(!k) return; let v=el.value;
  if(el.hasAttribute("data-money")){ const n=+(v.replace(/\D/g,"").slice(0,10)||0); v=n; el.value = n?money(n):""; }
  if(k.startsWith("f.")) S.p.f[k.slice(2)] = v; else S.p[k]=v;
  render();
});

/* ---------- conexión ---------- */
const caja = (titulo, texto, extra="") => `<div style="display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:28px"><img src="logo.png" alt="mima" style="height:30px"><img src="icon-512.png" alt="" style="width:150px;height:150px;border-radius:36px"><h1 class="h1">${titulo}</h1><p class="txt" style="font-size:17px;max-width:30ch">${texto}</p>${extra}</div>`;
function pantallaEntrar(error){
  $("#app").className="flow"; $("#layer").innerHTML="";
  $("#app").innerHTML = caja("Hola, bienvenida a Mima", "Entra con tu cuenta de Google para ver tus facturas y tus bolsillos.",
    `<button class="btn" id="entrar" style="max-width:340px;margin-top:6px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#fff" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" opacity=".8"/><path fill="#fff" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z" opacity=".6"/><path fill="#fff" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.8 9.4 6 12 6z" opacity=".7"/></svg>Entrar con Google</button>${error?`<p class="q" style="color:var(--rojo-t)">${esc(error)}</p>`:""}`);
  $("#entrar").onclick = async () => { const pr = new GoogleAuthProvider(); pr.setCustomParameters({prompt:"select_account"});
    try { await signInWithPopup(auth, pr); } catch(e){ if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) { signInWithRedirect(auth, pr); } else if(e && e.code!=="auth/popup-closed-by-user" && e.code!=="auth/cancelled-popup-request"){ pantallaEntrar("No se pudo entrar. Intenta otra vez."); } } };
}
function pantallaNoPermitido(correo){
  $("#app").className="flow";
  $("#app").innerHTML = caja("Esta cuenta no tiene acceso", `Entraste como <b>${esc(correo)}</b>. Mima solo abre con las cuentas de la familia. Pídele ayuda a Daniela.`, `<button class="btn2" id="salir" style="max-width:340px">Entrar con otra cuenta</button>`);
  $("#salir").onclick = () => signOut(auth);
}
function pantallaCargarDatos(){
  $("#app").className="flow";
  $("#app").innerHTML = caja("Falta cargar tus datos", "Esta es la primera vez que abres Mima aquí. Escoge el archivo <b>datos-octubre-mima.json</b> que te dio Claude para pasar las cuentas, los bolsillos y lo gastado.",
    `<label class="btn" style="max-width:340px;cursor:pointer">Escoger archivo<input id="archivo" type="file" accept=".json,application/json" hidden></label><p id="msg" class="small"></p>`);
  $("#archivo").onchange = async e => { const f = e.target.files[0]; if(!f) return; $("#msg").textContent="Cargando…";
    try { const d = JSON.parse(await f.text()); if(d.mima!==1) throw new Error("archivo");
      const b = writeBatch(fs);
      b.set(fsDoc(fs,"config/main"), d.config); b.set(fsDoc(fs,"ahorro/main"), d.ahorro);
      Object.entries(d.meses).forEach(([k,v])=>b.set(fsDoc(fs,"meses/"+k), v));
      b.set(fsDoc(fs,"estado/main"), d.estado);
      await b.commit(); $("#msg").textContent="Listo. Tus datos quedaron cargados.";
    } catch(err){ $("#msg").textContent = err.message==="archivo" ? "Ese no es el archivo de Mima. Escoge datos-octubre-mima.json." : "No se pudo cargar. Revisa que las reglas de Firestore estén pegadas e intenta otra vez."; } };
}
let subs = [];
function conectar(user){
  subs.forEach(u=>u()); subs=[]; if(unsubMes){ unsubMes(); unsubMes=null; } if(unsubBorr){ unsubBorr(); unsubBorr=null; }
  S.db = { doc: p => { const r = FDB.doc(p); return { ...r, set: d => r.set(capNombres(clone(d))) }; }, collection: FDB.collection }; S.user = user; S.ok = true;
  const err = e => { S.ok=false; subs.forEach(u=>u()); subs=[]; if(unsubMes){ unsubMes(); unsubMes=null; }
    if(e && e.code==="permission-denied") return pantallaNoPermitido(user.email||"");
    $("#app").className="flow"; $("#app").innerHTML = caja("No se pudieron abrir tus facturas", "Revisa tu conexión a internet y vuelve a abrir Mima."); };
  subs.push(FDB.doc("config/main").onSnapshot(s=>{ S.cfg = s.exists ? capNombres(clone(s.data())) : {cuentas:[],ingresosFijos:[]}; render(); }, err));
  subs.push(FDB.doc("ahorro/main").onSnapshot(s=>{ S.ahorro = s.exists ? s.data() : {saldo:0,movimientos:[]}; render(); }, err));
  subs.push(FDB.doc("estado/main").onSnapshot(s=>{ const k = s.exists ? s.data().mesActual : null;
    if(!k){ S.mesKey=null; S.mes=null; S.cargar=true; pantallaCargarDatos(); return; }
    S.cargar=false;
    if(k!==S.mesKey){ S.mesKey=k; if(unsubMes) unsubMes(); S.mes=null; S.mesListo=false; unsubMes = FDB.doc("meses/"+k).onSnapshot(ms=>{ S.mes = ms.exists ? capNombres(clone(ms.data())) : null; S.mesListo=true; if(!S.cfg) return; render(); }, err); if(unsubBorr) unsubBorr(); S.borr=null; unsubBorr = FDB.doc("borrador/"+mesSig(k)).onSnapshot(bs=>{ S.borr = bs.exists ? capNombres(clone(bs.data())) : null; if(S.cfg && S.mesListo) render(); }, ()=>{}); } }, err));
}
onAuthStateChanged(auth, user => {
  if(!user){ subs.forEach(u=>u()); subs=[]; S.ok=false; pantallaEntrar(); return; }
  conectar(user);
});
A.salir = () => signOut(auth);
})();
</script>
