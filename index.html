const cuentasCfg = () => (S.cfg?.cuentas || []).filter(c => !c.archivada);
function cuentaMes(c){ // estado de una cuenta en el mes actual
  const st = (S.mes?.cuentas || {})[c.id] || {};
  const valor = st.valor ?? c.valor;
  const bimestral = c.cada === 2;
  const toca = bimestral ? !!st.toca : true;
  const apartado = bimestral ? Math.round(valor/2) : valor;
  return { ...c, valor, toca, apartado, pagada: !!st.pagada, fechaPago: st.fechaPago, verificada: !!st.verificada || !c.variable };
}
const cuentasMes = () => cuentasCfg().map(cuentaMes).sort((a,b)=>a.dia-b.dia);
const recibido = () => (S.mes?.ingresos || []).reduce((s,i)=>s+(+i.valor||0),0) + (S.mes?.desdeAhorro||0);
const apartado = () => cuentasMes().reduce((s,c)=>s+c.apartado,0);
const libre = () => recibido() - apartado();
const bolsillos = () => (S.mes?.bolsillos || []);
const gastos = () => (S.mes?.gastos || []);
const gastado = id => gastos().filter(g=>g.bolsillo===id).reduce((s,g)=>s+(+g.valor||0),0);
function asignado(b){ if(!b.otros) return +b.asignado||0; return libre() - bolsillos().filter(x=>!x.otros).reduce((s,x)=>s+(+x.asignado||0),0); }
const quedan = b => asignado(b) - gastado(b.id);
const ordenados = () => { const bs = bolsillos().filter(b=>!b.borrado); return [...bs.filter(b=>!b.otros), ...bs.filter(b=>b.otros)]; };

/* ---------- guardar con deshacer ---------- */
async function guardar(cambios, toastTxt){
  // cambios: [{path, data}] ; se guarda copia previa para Deshacer
  if(!S.db) return;
  const prev = cambios.map(c => ({ path:c.path, data: clone(c.prev) }));
  try {
    await Promise.all(cambios.map(c => S.db.doc(c.path).set(c.data)));
    if(toastTxt) mostrarToast(toastTxt, prev);
  } catch(e){ mostrarToast("No se pudo guardar. Revisa tu conexión e intenta otra vez."); }
}

let toastTimer = null;
function mostrarToast(txt, prev){
  S.toast = { txt, prev }; renderToast();
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=null; renderToast(); }, prev ? 7000 : 4000);
}
async function deshacer(){
  const t = S.toast; if(!t?.prev) return; S.toast=null; renderToast();
  try { await Promise.all(t.prev.map(p => p.data ? S.db.doc(p.path).set(p.data) : S.db.doc(p.path).delete())); mostrarToast("Listo, se deshizo."); }
  catch(e){ mostrarToast("No se pudo deshacer. Intenta otra vez."); }
}
function renderToast(){

const liBolsillo = (b) => { const e=estadoB(b); return `<button class="item" data-act="verBolsillo" data-id="${b.id}">${sqB(b,"",!!e)}<span class="mid"><span class="t">${esc(b.nombre)}</span>${e==="casi"?'<span class="s warn">Casi se acaba</span>':e==="acabo"?'<span class="s warn">Se acabó este mes</span>':b.otros?'<span class="s">Gastos de una sola vez</span>':""}</span><span class="rt"><span class="l ${e?"warn":""}">${b.otros?"Libre":e==="casi"?"Solo quedan":"Quedan"}</span><span class="num v">${money(Math.max(0,quedan(b)))}</span></span></button>`; };
const heroLibre = () => { const L = libre(), Q = totalQuedan(); const pct = L>0 ? Math.max(0,Math.min(100,Math.round(Q/L*100))) : 0; const falta = Math.max(0, diasMes(S.mesKey) - Math.max(diaHoy(),1)); return `<section class="hero lila"><span class="q">Te queda en tus bolsillos</span><div style="display:flex;flex-direction:column;gap:4px"><span class="num cifra">${money(Q)}</span><span style="font-size:16px;font-weight:600;color:#4A3A7A">Ya sin contar tus cuentas</span></div><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><span style="font-size:16px;font-weight:500;color:var(--lila-t)">${falta===1?"Falta 1 día":"Faltan "+falta+" días"} · recibiste ${money(recibido())}</span></section>`; };
function itemCuenta(c, conMarcar){
  const k = clasif(c);
  let bg="", sq="", sub="";
  if(k==="vencida"){ bg='style="background:var(--rojo-bg);border-color:transparent"'; sq=`<span class="sq" style="background:var(--rojo-sq);color:var(--rojo)">${ic("alerta",'style="width:26px;height:26px"')}</span>`; sub=`<span class="s" style="color:var(--rojo-t);font-weight:600">Vencido el día ${c.dia}</span>`; }
  else if(k==="verificar"){ bg='style="background:var(--ver-bg);border-color:transparent"'; sq=`<span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic("recibo",'style="width:26px;height:26px"')}</span>`; sub=`<span class="s warn">Verifica el recibo · día ${c.dia}</span>`; }
  else if(k==="pagada"){ sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`; sub=`<span class="s" style="color:var(--ok);font-weight:600">✓✓ Pagada${c.fechaPago?" el "+Number(c.fechaPago.slice(8)):""}</span>`; }
  else if(k==="notoca"){ bg='style="background:transparent;border-style:dashed;border-color:#DCD6CF"'; sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`; sub=`<span class="s">Este mes no toca · apartando la mitad</span>`; }
  else { sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`; sub=`<span class="s">${c.dia===diaHoy()?"Vence hoy":c.dia===diaHoy()+1?"Vence mañana":"Vence el "+c.dia}</span>`; }
  const val = k==="notoca" ? c.apartado : c.valor;
  const mark = conMarcar && (k!=="pagada" && k!=="notoca") ? `<button class="mark" role="checkbox" aria-checked="false" data-act="pagar" data-id="${c.id}"><span class="box"></span>Marcar pagado</button>` : "";
  return `<div class="card" ${bg}><button class="row" data-act="verCuenta" data-id="${c.id}">${sq}<span class="mid"><span class="t">${esc(c.nombre)}</span>${sub}</span><span class="num v" ${k==="pagada"?'style="color:var(--ink2)"':""}>${money(val)}</span></button>${mark}</div>`;
}

/* ---------- próximo mes: piezas ---------- */
function tarjetaProximo(){ if(!verProximo()) return ""; const k = sigKey(); const L = borrLibre();
  return `<div class="sec"><h2 class="h2">Lo que viene</h2>
  <button class="prox" data-act="proximo"><span class="prox-tag">${ic("calendario")}${cap(mesNombre(k))} · estimado</span>
    <span class="prox-fila"><span class="q">Vas a apartar para cuentas</span><span class="num v">${money(borrApartar())}</span></span>
    <span class="prox-fila"><span class="q">Quedarían para tus bolsillos</span><span class="num v" ${L<0?'style="color:var(--rojo-t)"':""}>${money(L)}</span></span>
    <span class="prox-cta">Ver ${mesNombre(k)}${ic("sig")}</span></button></div>`; }
function itemBorr(c){ const k = sigKey(); let cls="", sq=`<span class="sq">${ic(iconoCuenta(c.nombre))}</span>`, sub="", val=c.valor, tap=true;
  if(!c.toca){ cls="pre"; sub=`<span class="s">No toca en ${mesNombre(k)} · apartando la mitad</span>`; val=c.apartado; tap=false; }
  else if(c.pagada){ sub=`<span class="s" style="color:var(--ok);font-weight:600">✓✓ Ya la pagaste${c.fechaPago?" el "+Number(c.fechaPago.slice(8))+" "+fechaDe(c.fechaPago):""}</span>`; }
  else if(!c.cambiada){ cls="pre"; sq=`<span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic("recibo",'style="width:26px;height:26px"')}</span>`; sub=`<span class="s warn">Valor de ${mesNombre(S.mesKey)} · verifica el real</span>`; }
  else { sub=`<span class="s">Vence el ${c.dia} de ${mesNombre(k)}</span>`; }
  const mark = c.toca ? `<button class="mark" role="checkbox" aria-checked="${c.pagada}" data-act="bPagar" data-id="${c.id}"><span class="box" ${c.pagada?'style="background:var(--ink)"':""}>${c.pagada?ic("check",'style="width:18px;height:18px;color:#fff;stroke-width:3"'):""}</span>${c.pagada?"Ya la pagué":"Ya la pagué por adelantado"}</button>` : "";
  return `<div class="card ${cls}"><button class="row" ${tap?`data-act="bValor" data-id="${c.id}"`:'style="cursor:default"'}>${sq}<span class="mid"><span class="t">${esc(c.nombre)}</span>${sub}</span><span class="num v" ${c.pagada?'style="color:var(--ink2)"':""}>${money(val)}</span>${tap&&!c.pagada?ic("pen",'class="ic pen"'):""}</button>${mark}</div>`; }

/* ---------- vistas ---------- */
const V = {};
V.proximo = () => { const k = sigKey(); const L = borrLibre(); const ing = borrIngresos(); const ah = totalQuedan(); const actual = mesNombre(S.mesKey);
  return `<div class="prox-top"><button class="back" data-act="salirProximo">${ic("atras")}Volver a ${actual}</button><div class="prox-band" role="note">${ic("calendario")}<span>Estás viendo <b>${cap(mesNombre(k))}</b>. Es un estimado.</span></div></div>
  <div><h1 class="mes">${cap(mesNombre(k))}</h1><span class="sub">Empieza el 1 de ${mesNombre(k)}. Si ya sabes un valor, cámbialo aquí.</span></div>
  <section class="hero proxh"><span class="q">Quedarían para tus bolsillos</span><span class="num cifra" ${L<0?'style="color:var(--rojo-t)"':""}>${money(L)}</span><span class="num" style="font-size:16px;font-weight:600;color:var(--prox-t)">Recibirías ${money(borrRecibe())} · apartarías ${money(borrApartar())}</span></section>
  <div class="sec"><h2 class="h2">Lo que vas a recibir</h2>
    <div class="grp">${ing.map(i=>`<button class="li" data-act="${i.fijo?"bFijo":"bExtraEdit"}" data-id="${i.id}"><span class="sq s">${ic(i.fijo?"persona":"billete")}</span><span class="n"><b>${esc(i.nombre)}</b><small>${i.fijo?"Todos los meses":"Solo en "+mesNombre(k)}</small></span><span class="num lv">${money(i.valor)}</span>${ic("pen",'class="ic pen"')}</button>`).join("")}</div>
    <button class="link" data-act="bExtra" style="align-self:flex-start">${ic("mas",'style="stroke-width:2.4"')}Agregar otro ingreso</button></div>
  <div class="sec"><h2 class="h2">Cuentas de ${mesNombre(k)}</h2>${cuentasBorr().map(itemBorr).join("")}</div>
  <div class="sec"><h2 class="h2">Tu ahorro</h2><div class="item" style="background:var(--ahorro-card);border-color:var(--ahorro-line);cursor:default">${sqAhorro()}<span class="mid"><span class="t">Lo que te sobraría en ${actual}</span><span class="s">Estimado. Cambia cada vez que gastas, y se guarda en tu Ahorro cuando termine ${actual}.</span></span><span class="rt"><span class="l">Estimado</span><span class="num v">${money(ah)}</span></span></div></div>
  <button class="btn2" data-act="salirProximo">${ic("atras")}Volver a ${actual}</button>`; };
V.inicio = () => {
  if(necesitaCierre()) return V.cierre();
  const cs = cuentasMes(); const atender = cs.filter(c=>["vencida","verificar"].includes(clasif(c))); const prox = cs.filter(c=>clasif(c)==="proxima");
  const porPagar = [...atender, ...prox].slice(0,2); const pendientes = cs.filter(c=>!["pagada","notoca"].includes(clasif(c))).length;
  const bs = ordenados().filter(b=>!b.otros).slice(0,6);
  const d = hoy();
  return `${HEADER_AYUDA}
  <div><h1 class="mes">${cap(mesNombre(S.mesKey))}</h1><span class="sub">Hoy, ${DIAS[d.getDay()]} ${d.getDate()}</span></div>
  ${heroLibre()}
  ${invitaGuia()}
  <div class="sec"><h2 class="h2">Por pagar</h2><p class="nota">Su plata ya está separada.</p>
    ${porPagar.length ? porPagar.map(c=>itemCuenta(c,false)).join("") : `<div class="empty"><p class="q">Ya pagaste todo este mes</p></div>`}
    <button class="btn2" data-tab="cuentas">Ver todas las cuentas (${pendientes})${ic("sig")}</button></div>
  <div class="sec"><h2 class="h2">Bolsillos</h2><p class="nota">Se van gastando de a poco.</p>
    ${bs.map(liBolsillo).join("")}
    <button class="btn2" data-tab="bolsillos">Ver todos los bolsillos (${ordenados().length})${ic("sig")}</button></div>
  ${tarjetaProximo()}
  ${navTabs()}`;
};
V.cuentas = () => {
  const cs = cuentasMes(); const g = k => cs.filter(c=>clasif(c)===k);
  const atender=[...g("vencida"),...g("verificar")], prox=[...g("proxima"),...g("notoca")], pag=g("pagada");
  const total = cs.filter(c=>c.toca).length, pagadas = pag.length;
  const falta = cs.filter(c=>c.toca && !c.pagada).reduce((s,c)=>s+c.valor,0);
  const d = hoy();
  return `<div><h1 class="mes">Cuentas</h1><span class="sub">${cap(mesNombre(S.mesKey))} · hoy, ${DIAS[d.getDay()]} ${d.getDate()}</span></div>
  ${ayuda("<b>Lo que pagas cada mes.</b> Cuando pagues una, toca <b>Marcar pagado</b>.", 1)}
  <section class="hero amb"><span class="q">Te falta por pagar</span><span class="num cifra" style="font-size:34px">${money(falta)}</span><div class="bar" aria-hidden="true"><i style="width:${total?Math.round(pagadas/total*100):0}%"></i></div><span style="font-size:16px;font-weight:500;color:var(--amb-t)">Llevas ${pagadas} de ${total} cuentas pagadas</span></section>
  ${atender.length?`<div class="sec"><h2 class="h2">Para atender</h2><p class="nota">Rojo: ya venció. Amarillo: revisa el recibo.</p>${atender.map(c=>itemCuenta(c,true)).join("")}</div>`:""}
  ${prox.length?`<div class="sec"><h2 class="h2">Próximas</h2>${prox.map(c=>itemCuenta(c,true)).join("")}</div>`:""}
  ${pag.length?`<div class="sec"><h2 class="h2">Pagadas</h2>${pag.map(c=>itemCuenta(c,false)).join("")}</div>`:""}
  ${navTabs()}`;
};
V.bolsillos = () => `<div><h1 class="mes">Bolsillos</h1><span class="sub">Te queda <b class="num" style="color:var(--ink);font-weight:600">${money(totalQuedan())}</b> en tus bolsillos para ${Math.max(0,diasMes(S.mesKey)-Math.max(diaHoy(),1))} días</span></div>
  ${ayuda("<b>Plata separada para cada cosa.</b> Cada gasto se resta de su bolsillo.", 2)}
  <div class="sec">${ordenados().map(liBolsillo).join("")}</div>
  <button class="btn2" data-act="crear">${ic("mas",'style="stroke-width:2.4"')}Crear bolsillo</button>
  <div class="sec" style="margin-top:4px"><h2 class="h2">Tu ahorro</h2><div class="item" style="background:var(--ahorro-card);border-color:var(--ahorro-line);cursor:default">${sqAhorro()}<span class="mid"><span class="t">Ahorro</span><span class="s">Lo que te ha sobrado otros meses. Se suma solo cuando termina el mes.</span></span><span class="rt"><span class="l">Tienes</span><span class="num v">${money(S.ahorro?.saldo||0)}</span></span></div></div>
  ${navTabs()}`;
V.ajustes = () => { const ing = (S.cfg?.ingresosFijos||[]); const it=(act,i,t,s)=>`<button class="li" data-act="${act}" style="min-height:72px"><span class="sq">${ic(i)}</span><span class="n"><b>${t}</b><small>${s}</small></span>${ic("sig",'class="ic chev"')}</button>`;
  const av = S.cfg?.avisos||{};
  return `<div><h1 class="mes">Ajustes</h1><p class="txt" style="font-size:17px">Aquí puedes cambiar todo. Si te equivocas, siempre puedes deshacer.</p></div>
  <div class="grp">${it("guia0","ayuda","¿Cómo funciona Mima?","La guía en 5 pasos cortos")}</div>
  <div class="grp">${it("recibo","billete","Lo que recibo cada mes", money(ing.reduce((s,i)=>s+i.valor,0))+(ing[0]?" · de "+esc(ing.map(i=>i.nombre).join(", ")):""))}${it("misCuentas","cuentas","Mis cuentas", cuentasCfg().length+" cuentas")}${`<button class="li" data-tab="bolsillos" style="min-height:72px"><span class="sq">${ic("bolsa")}</span><span class="n"><b>Mis bolsillos</b><small>${ordenados().length} bolsillos</small></span>${ic("sig",'class="ic chev"')}</button>`}</div>
  <div class="grp">${it("avisos","correo","Avisos al correo", av.correo?"2 días antes de cada pago":"Escribe tu correo")}${it("misCuentas","archivo","Cuentas que ya no pagas", (S.cfg?.cuentas||[]).filter(c=>c.archivada).length+" guardadas")}${it("meses","calendario","Meses anteriores","Ver cómo te fue")}</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px"><span class="small">Entraste como ${esc(S.user?.email||"")}</span><button class="btn3" data-act="salir" style="width:auto;padding:0 12px">Salir</button></div>
  ${navTabs()}`; };

/* guía ¿Cómo funciona? */
const sinAcciones = html => html.replace(/ data-act="[^"]*"/g,"").replace(/ data-id="[^"]*"/g,"").replace(/<button /g,'<button tabindex="-1" ');
const ejemplo = (html, etiqueta="Así se ve en Mima") => `<div class="ejemplo" aria-hidden="true"><span class="lbl">${etiqueta}</span>${sinAcciones(html)}</div>`;
const gli = (icono, html, cls="") => `<li class="${cls}"><span class="sq">${ic(icono)}</span><span>${html}</span></li>`;
const GUIA = [
  () => ({ titulo:"Tu plata se divide en tres", cuerpo:`<div class="gtexto"><p>Mima separa tu plata en tres partes.</p></div>
    <div class="reparto"><div class="fila"><span class="sq">${ic("billete")}</span><span class="mid"><span class="t">Recibes</span><span class="s">La plata del mes</span></span><span class="num v">${money(recibido())}</span></div>
    <div class="fila"><span class="sq" style="background:var(--amb);color:var(--amb-t)">${ic("cuentas")}</span><span class="mid"><span class="t">Cuentas</span><span class="s">Facturas. Van al bolsillo del banco.</span></span><span class="num v">${money(apartado())}</span></div>
    <div class="fila"><span class="sq" style="background:var(--lila);color:var(--lila-t)">${ic("bolsa")}</span><span class="mid"><span class="t">Bolsillos</span><span class="s">Mercado, gasolina, gustos…</span></span><span class="num v">${money(bolsillos().filter(b=>!b.otros&&!b.borrado).reduce((s,b)=>s+(+b.asignado||0),0))}</span></div>
    <div class="fila"><span class="sq">${ic("otros")}</span><span class="mid"><span class="t">Libre</span><span class="s">Lo que no separaste. Está en Otros.</span></span><span class="num v">${money((()=>{const o=bolsillos().find(b=>b.otros); return o?asignado(o):0;})())}</span></div></div>
    <div class="gtexto"><p>Las cuentas se pagan de una vez. Los bolsillos se gastan de a poco.</p></div>` }),
  () => { const c = cuentasMes().find(x=>!["pagada","notoca"].includes(clasif(x))) || cuentasMes()[0];
    return { titulo:"Cuentas: lo que tienes que pagar", cuerpo:`<div class="gtexto"><p>Luz, agua, celular… Su plata va a tu <b>bolsillo del banco</b>.</p></div>
    ${c?ejemplo(itemCuenta(c,true)):""}
    <ul class="glista">${gli("check","Cuando pagues, toca <b>Marcar pagado</b>.")}
    ${gli("recibo","<b>Amarillo</b>: el valor cambia. Escribe el del recibo.","amar")}
    ${gli("alerta","<b>Rojo</b>: ya pasó la fecha.","rojo")}
    ${gli("gota","<b>Cada 2 meses</b>, como el agua: cada mes separas la mitad.","notoca")}</ul>` }; },
  () => { const b = ordenados().find(x=>!x.otros); const o = ordenados().find(x=>x.otros);
    return { titulo:"Bolsillos: plata separada para cada cosa", cuerpo:`<div class="gtexto"><p>Como los del banco: separas plata para algo y la gastas de a poco.</p><p>El del banco es para las cuentas. Los de Mima, para lo demás.</p></div>
    ${b||o?ejemplo([b,o].filter(Boolean).map(liBolsillo).join("")):""}
    <ul class="glista">${gli("mas","Para anotar un gasto: <b>+ Agregar</b>, luego <b>Agregar gasto</b>.")}
    ${gli("otros","<b>Otros</b>: gastos de una sola vez, como una serenata. Sale de lo libre.")}
    ${gli("bolsa","Si un bolsillo no alcanza, entra y toca <b>Pasar plata</b>.")}</ul>` }; },
  () => ({ titulo:"Cuando termina el mes", cuerpo:`<ul class="glista">${gli("ahorro","Lo que sobre se guarda en tu <b>Ahorro</b>.")}
    ${gli("calendario","El mes nuevo empieza con 3 pasos cortos.")}
    ${gli("sig","Desde el día "+DIA_PROXIMO+" ves el mes siguiente en <b>Lo que viene</b>.")}</ul>` }),
  () => ({ titulo:"Si te equivocas", cuerpo:`<ul class="glista">${gli("check","Después de cada cambio puedes tocar <b>Deshacer</b>.")}
    ${gli("pen","Para cambiar algo, toca el lápiz.")}
    ${gli("persona","Si algo no te cuadra, pregúntale a Daniela.")}
    ${gli("ayuda","Esta guía está en <b>¿Cómo funciona?</b>, en Inicio y Ajustes.")}</ul>` })
];
V.guia = () => { const n = Math.max(0, Math.min(GUIA.length-1, S.p.paso||0)); const g = GUIA[n](); const ult = n===GUIA.length-1;
  return `<div class="top"><span class="lbl">Paso ${n+1} de ${GUIA.length}</span><button class="link" data-act="cerrarGuia">Cerrar</button></div>
  <div class="gpasos" role="img" aria-label="Paso ${n+1} de ${GUIA.length}">${GUIA.map((_,i)=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>

  <div class="bottom"><div class="${n>0?"par":""}">${n>0?`<button class="btn2" data-act="guiaAnt">${ic("atras")}Anterior</button>`:""}<button class="btn" data-act="${ult?"cerrarGuia":"guiaSig"}">${ult?"Entendido":"Siguiente"+ic("sig",'style="stroke-width:2.4"')}</button></div></div>`; };

/* menú agregar */
V.menu = () => V[S.p.base||"inicio"]() ;
function hojaMenu(){ return `<div class="overlay" data-act="cerrarHoja"><section class="sheet" role="dialog" aria-label="¿Qué quieres agregar?" data-stop><span class="grab" aria-hidden="true"></span><h1 class="h2" style="font-size:24px;margin:6px 0 4px">¿Qué quieres agregar?</h1>
  <button class="mopt" data-act="nuevoGasto"><span class="sq" style="background:var(--ink);color:#fff">${ic("menos")}</span><span class="mid"><span class="t" style="font-size:20px">Agregar gasto</span><span class="s">Mercado, gasolina, un gusto…</span></span>${ic("sig")}</button>
  <button class="mopt" data-act="nuevoIngreso"><span class="sq" style="background:var(--lila)">${ic("mas")}</span><span class="mid"><span class="t" style="font-size:20px">Agregar ingreso</span><span class="s">Plata que te llegó</span></span>${ic("sig")}</button>
  <button class="btn2" data-act="cerrarHoja" style="margin-top:6px">Cancelar</button></section></div>`; }

/* agregar / cambiar gasto */
V.gasto = () => { const p=S.p; const bs=ordenados(); const b = bs.find(x=>x.id===p.bolsillo); const edit = !!p.editId;
  const ant = edit ? gastos().find(g=>g.id===p.editId) : null;
  const q = b ? quedan(b) + (ant && ant.bolsillo===b.id ? +ant.valor : 0) : 0;
  return `<div class="top"><h1 class="h1">${edit?"Cambiar gasto":"Agregar gasto"}</h1>${cancelar()}</div>
  ${edit?`<span class="txt" style="margin-top:-8px">Lo agregaste el ${fechaLarga(ant.fecha).toLowerCase()} ${fechaDe(ant.fecha)}</span>`:""}
  <div style="display:flex;flex-direction:column;gap:6px"><span class="q">¿De qué bolsillo?</span><p class="nota" style="margin-top:0">Si es algo de una sola vez, usa Otros.</p></div>
  <div class="chips" role="group" aria-label="Bolsillos">${bs.map(x=>{const e=estadoB(x);return `<button class="chip ${x.id===p.bolsillo?"on":""}" aria-pressed="${x.id===p.bolsillo}" data-act="chipB" data-id="${x.id}">${sqB(x,"",!!e)}<span>${esc(x.nombre)}</span></button>`}).join("")}</div>
  ${b?.otros?`<div style="display:flex;flex-direction:column;gap:8px"><label for="nota" class="q">¿En qué fue? <span style="font-weight:500;color:var(--ink2)">(opcional)</span></label><input id="nota" class="inp" type="text" autocomplete="off" placeholder="Toca una idea o escríbelo aquí" value="${esc(p.nota||"")}" data-field="nota"><div class="sugs">${["Un regalo","Una salida","Medicamento"].map(s=>`<button class="sug" data-act="sug" data-v="${s}">${s}</button>`).join("")}</div></div>`:""}
  <section class="valor" style="border:1.5px solid var(--line)"><span style="font-size:15px;font-weight:600;color:var(--ink2)">${edit?"¿Cuánto fue?":"¿Cuánto gastaste?"}</span><span class="num cifra">${money(p.monto||0)}</span>${b?`<span class="num small">${edit&&ant?`Antes decía ${money(ant.valor)} · `:""}Te quedarán <b style="color:var(--ink)">${money(q-(p.monto||0))}</b> en ${esc(b.nombre)}</span>`:`<span class="small">Primero escoge el bolsillo</span>`}</section>
  ${teclado()}
  <div class="bottom"><button class="btn" data-act="guardarGasto" ${!b||!(p.monto>0)?"disabled":""}>${edit?"Guardar":"Agregar"}</button>${edit?`<button class="btn3 rojo" data-act="borrarGasto">Borrar este gasto</button>`:""}</div>`; };
function hojaNoAlcanza(){ const p=S.p; const b=bolsillos().find(x=>x.id===p.bolsillo); const falta=p.falta; const opciones = ordenados().filter(x=>x.id!==b.id && quedan(x)>=falta).sort((a,c)=>(c.otros?1:0)-(a.otros?1:0)||quedan(c)-quedan(a)); const ah=(S.ahorro?.saldo||0)>=falta; if(p.origen==null) p.origen = opciones[0]?.id || (ah?"ahorro":null);
  const nom = p.origen==="ahorro"?"tu Ahorro":esc(bolsillos().find(x=>x.id===p.origen)?.nombre||"");
  return `<div class="overlay" data-act="cerrarHoja"><section class="sheet" role="dialog" aria-labelledby="na" data-stop><span class="grab" aria-hidden="true"></span>
  <span class="num txt">A ${esc(b.nombre)} solo le quedan ${money(Math.max(0,p.quedaba))}</span><h1 id="na" class="h2" style="font-size:24px">Te faltan ${money(falta)}. ¿De dónde los sacamos?</h1>
  <div role="radiogroup" style="display:flex;flex-direction:column;gap:8px">${opciones.slice(0,4).map(x=>`<button class="opt ${p.origen===x.id?"on":""}" role="radio" aria-checked="${p.origen===x.id}" data-act="naOrigen" data-id="${x.id}"><span class="radio"></span>${sqB(x,"s")}<span class="grow">${esc(x.nombre)}</span><span class="rt"><span class="l">Quedan</span><span class="num" style="font-size:18px;font-weight:600">${money(quedan(x))}</span></span></button>`).join("")}${ah?`<button class="opt ${p.origen==="ahorro"?"on":""}" role="radio" aria-checked="${p.origen==="ahorro"}" data-act="naOrigen" data-id="ahorro"><span class="radio"></span>${sqAhorro("s")}<span class="grow">Ahorro</span><span class="rt"><span class="l">Tienes</span><span class="num" style="font-size:18px;font-weight:600">${money(S.ahorro.saldo)}</span></span></button>`:""}</div>
  ${!p.origen?`<p class="small">No hay ningún bolsillo con ${money(falta)}. Cambia el valor del gasto o agrega un ingreso.</p>`:""}
  <div style="display:flex;flex-direction:column;gap:4px"><button class="btn" data-act="naConfirmar" ${p.origen?"":"disabled"}>${p.origen?"Sacar de "+nom:"Sacar de otro bolsillo"}</button><button class="btn3" data-act="cerrarHoja">Cambiar el valor del gasto</button></div></section></div>`; }

/* ingreso */
V.ingreso1 = () => `<div class="top"><h1 class="h1">Agregar ingreso</h1>${cancelar()}</div><span class="q" style="margin-top:4px">¿Cuánto recibiste?</span>
  <section class="valor"><span class="num cifra">${money(S.p.monto||0)}</span><span class="small">Se suma a tu plata libre, en Otros</span></section>${teclado()}
  <div class="bottom"><button class="btn" data-act="ing2" ${S.p.monto>0?"":"disabled"}>Siguiente${ic("sig",'style="stroke-width:2.4"')}</button></div>`;
V.ingreso2 = () => { const p=S.p; return `<div class="top">${backBtn()}${cancelar("cancelarFlujo")}</div>
  <div><span class="txt">Recibiste</span><div class="num mes">${money(p.monto)}</div></div>
  <h1 class="h2" style="margin-top:6px">¿Esta plata te llega todos los meses o solo esta vez?</h1>
  <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">${[["una","Solo esta vez","Se suma a tu plata libre este mes"],["fijo","Todos los meses","Se suma este mes y te la pedimos al empezar cada mes"]].map(([k,t,s])=>`<button class="opt ${p.tipo===k?"on":""}" role="radio" aria-checked="${p.tipo===k}" data-act="ingTipo" data-v="${k}" style="min-height:76px"><span class="radio"></span><span>${t}<small>${s}</small></span></button>`).join("")}</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px"><label for="quien" class="q">¿Quién te la dio? <span style="font-weight:500;color:var(--ink2)">(opcional)</span></label><input id="quien" class="inp" type="text" autocomplete="off" placeholder="Toca una idea o escríbelo aquí" value="${esc(p.quien||"")}" data-field="quien"><div class="sugs">${["Daniela","Mi otra hija","Un regalo"].map(s=>`<button class="sug" data-act="sugQuien" data-v="${s}">${s}</button>`).join("")}</div></div>
  <div class="bottom"><button class="btn" data-act="guardarIngreso">Guardar</button></div>`; };

/* valor de una cuenta (verificar recibo / cambiar valor del mes) */
V.valorCuenta = () => { const c = cuentaMes(cuentasCfg().find(x=>x.id===S.p.id)); const k=clasif(c);
  return `<div class="top">${backBtn()}</div>
  ${k==="verificar"?`<section style="background:var(--ver-bg);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px"><span class="sq" style="background:var(--ver-sq);color:var(--ver-i)">${ic(iconoCuenta(c.nombre))}</span><span class="mid"><span class="h2">${esc(c.nombre)}</span><span class="s warn">Verifica el recibo · se paga el día ${c.dia}</span></span></section>`:`<div><h1 class="h1">${esc(c.nombre)}</h1><span class="txt">Se paga el día ${c.dia}</span></div>`}
  <span class="q" style="margin-top:4px">¿Cuánto llegó el recibo?</span>
  <section class="valor"><span class="num cifra">${money(S.p.monto)}</span><span class="num small">${S.p.monto===c.valor?"Es el valor del mes pasado":"El mes pasado fue "+money(c.valor)}</span></section>
  ${teclado()}
  <div class="bottom"><span class="small" style="text-align:center">El próximo mes te sugerimos este mismo valor.</span><button class="btn" data-act="guardarValorCuenta" ${S.p.monto>0?"":"disabled"}>Guardar</button>
  ${!c.pagada && c.toca?`<button class="btn3" data-act="pagarDesdeValor">Guardar y marcar pagado</button>`:""}</div>`; };

/* detalle de bolsillo */
V.bolsillo = () => { const b = bolsillos().find(x=>x.id===S.p.id); if(!b) return V.bolsillos(); const e=estadoB(b); const a=asignado(b), g=gastado(b.id), q=a-g;
  const gs = gastos().filter(x=>x.bolsillo===b.id).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  return `<div class="top">${backBtn("Atrás")}</div>
  <div class="top">${`<div style="display:flex;align-items:center;gap:12px;min-width:0">${(()=>{const [bg,fg]=colorDe(b);return `<span class="sq" style="width:56px;height:56px;border-radius:16px;background:${bg};color:${fg}">${ic(b.otros?"otros":(b.icono||iconoPara(b.nombre)),'style="width:28px;height:28px"')}${e?'<span class="pt" style="width:16px;height:16px;border-color:var(--bg)"></span>':""}</span>`})()}<h1 class="mes" style="overflow-wrap:anywhere">${esc(b.nombre)}</h1></div>`}${b.otros?"":`<button class="link" data-act="renombrar" aria-label="Cambiar el nombre" style="width:44px;justify-content:center;color:var(--ink3)">${ic("pen",'style="width:22px;height:22px"')}</button>`}</div>
  ${b.otros?`<p class="small" style="margin-top:-8px">Para gastos de una sola vez, como una serenata. Sale de tu plata libre.</p>`:""}
  <section style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:16px 22px;display:flex;flex-direction:column;gap:8px"><span class="q ${e?"warn":""}">${b.otros?"Te queda libre":e==="casi"?"Solo quedan":"Quedan"}</span><span class="num cifra">${money(Math.max(0,q))}</span><div class="bar gris" aria-hidden="true"><i style="width:${a>0?Math.max(0,Math.min(100,Math.round(q/a*100))):0}%"></i></div><span class="num txt">Tenías ${money(a)} · Has gastado ${money(g)}</span></section>
  <button class="btn2" data-act="pasar">${ic("mas",'style="stroke-width:2.4"')}Pasar plata a este bolsillo</button>
  <div class="sec" style="gap:8px"><h2 class="h2">Lo que gastaste</h2>${gs.length?`<span class="small">Si te equivocaste, toca el gasto o el lápiz para cambiarlo.</span><div class="grp">${gs.map(x=>`<button class="li" data-act="editarGasto" data-id="${x.id}"><span class="n"><b>${x.nota?esc(x.nota):fechaLarga(x.fecha)}</b><small>${x.nota?fechaLarga(x.fecha)+" "+fechaDe(x.fecha):fechaDe(x.fecha)}</small></span><span class="num lv">${money(x.valor)}</span>${ic("pen",'class="ic pen"')}</button>`).join("")}</div>`:`<div class="empty"><p class="small">Todavía no has gastado de este bolsillo este mes.</p></div>`}</div>
  <div class="bottom"><button class="btn" data-act="gastoEn">Agregar gasto en ${esc(b.nombre)}</button>${b.otros?"":`<button class="btn3 rojo" data-act="borrarB">Borrar bolsillo</button>`}</div>`; };
function hojaBorrar(){ const b=bolsillos().find(x=>x.id===S.p.id); const q=Math.max(0,quedan(b)); return `<div class="overlay" data-act="cerrarHoja"><section class="sheet" role="alertdialog" aria-labelledby="bt" data-stop><span class="grab" aria-hidden="true"></span><span class="sq" style="width:52px;height:52px;border-radius:16px;background:rgba(220,38,38,.12);color:var(--rojo);margin-top:6px">${ic("caneca",'style="width:28px;height:28px"')}</span><h1 id="bt" class="h2" style="font-size:24px">¿Seguro que quieres borrar ${esc(b.nombre)}?</h1><p class="txt" style="font-size:17px">Los <b class="num" style="color:var(--ink);font-weight:600">${money(q)}</b> que quedan pasan a tu plata libre, en Otros. Lo que ya gastaste queda guardado en este mes.</p><div style="display:flex;flex-direction:column;gap:12px;margin-top:6px"><button class="btn rojo" data-act="confirmarBorrar">Sí, borrar bolsillo</button><button class="btn2" data-act="cerrarHoja">No, dejarlo</button></div></section></div>`; }

/* pasar plata */
function origenes(destId){ return ordenados().filter(x=>x.id!==destId); }
V.pasar = () => { const p=S.p; const d=bolsillos().find(x=>x.id===p.destino); if(p.origen==null){ const os=origenes(d.id).filter(x=>quedan(x)>0).sort((a,c)=>(c.otros?1:0)-(a.otros?1:0)||quedan(c)-quedan(a)); p.origen = os[0]?.id || ((S.ahorro?.saldo||0)>0?"ahorro":null); }
  const o = p.origen==="ahorro"?{nombre:"Ahorro",ahorro:true}:bolsillos().find(x=>x.id===p.origen); const disp = o? (o.ahorro?(S.ahorro?.saldo||0):quedan(o)) : 0; const m=p.monto||0;
  return `<div class="top">${backBtn()}${cancelar()}</div><h1 class="h1">Pasar plata a ${esc(d.nombre)}</h1>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="q">Sale de</span>${o?`<button class="item" data-act="escogerOrigen" style="min-height:64px">${o.ahorro?sqAhorro("s"):sqB(o,"s")}<span class="mid"><span class="t" style="font-size:17px">${esc(o.nombre)}</span><span class="num s">${o.ahorro?"Tienes":"Quedan"} ${money(disp)}</span></span><span style="font-size:16px;font-weight:600;text-decoration:underline;text-underline-offset:3px">Cambiar</span></button>`:`<div class="empty"><p class="small">Ningún bolsillo tiene plata para pasar.</p></div>`}</div>
  <section class="valor" style="gap:12px"><div><span style="font-size:15px;font-weight:600;color:var(--ink2)">¿Cuánto pasas?</span><div class="num cifra">${money(m)}</div></div>${o?`<div style="display:flex;flex-direction:column;gap:8px;border-top:1.5px solid var(--line);padding-top:12px;width:100%;text-align:left">${[[o, disp-m],[d, quedan(d)+m]].map(([x,v])=>`<span style="display:flex;align-items:center;gap:10px;font-size:16px">${x.ahorro?sqAhorro("xs"):sqB(x,"xs")}<span class="grow">${esc(x.nombre)} quedará con</span><b class="num" style="font-weight:600;${v<0?"color:var(--rojo-t)":""}">${money(v)}</b></span>`).join("")}</div>`:""}</section>
  ${m>disp&&o?`<p class="small" style="color:var(--rojo-t);font-weight:600;text-align:center">${esc(o.nombre)} solo tiene ${money(disp)}.</p>`:""}
  ${teclado()}<div class="bottom"><button class="btn" data-act="confirmarPasar" ${o&&m>0&&m<=disp?"":"disabled"}>Pasar la plata</button></div>`; };
V.pasarOrigen = () => { const p=S.p; return `<div class="top">${backBtn()}${cancelar()}</div><h1 class="h1">¿De dónde sacas la plata?</h1>
  <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">${origenes(p.destino).map(x=>{const q=quedan(x);return `<button class="opt ${p.origen===x.id?"on":""}" role="radio" aria-checked="${p.origen===x.id}" data-act="setOrigen" data-id="${x.id}" ${q>0?"":"disabled"}><span class="radio"></span>${sqB(x,"s")}<span class="grow">${esc(x.nombre)}</span><span class="rt"><span class="l">${q>0?"Quedan":"No tiene"}</span><span class="num" style="font-size:18px;font-weight:600">${money(Math.max(0,q))}</span></span></button>`}).join("")}
  <button class="opt ${p.origen==="ahorro"?"on":""}" role="radio" aria-checked="${p.origen==="ahorro"}" data-act="setOrigen" data-id="ahorro" ${(S.ahorro?.saldo||0)>0?"":"disabled"}><span class="radio"></span>${sqAhorro("s")}<span class="grow">Ahorro</span><span class="rt"><span class="l">Tienes</span><span class="num" style="font-size:18px;font-weight:600">${money(S.ahorro?.saldo||0)}</span></span></button></div>
  <div class="bottom"><button class="btn" data-act="volver">Listo</button></div>`; };

/* crear / renombrar bolsillo */
V.crear1 = () => { const p=S.p; const ren = !!p.renombrar; const b = ren ? bolsillos().find(x=>x.id===p.renombrar) : null; const nombre=p.nombre??(b?.nombre||"");
  const prev = {nombre:nombre||"Tu bolsillo", icono:iconoPara(nombre), color: ren? b.color : nextColor()};
  return `<div class="top"><h1 class="h1">${ren?"Cambiar nombre":"Crear bolsillo"}</h1>${cancelar()}</div>
  <div style="display:flex;flex-direction:column;gap:8px"><label for="nombreB" class="q">¿Cómo se llama?</label><input id="nombreB" class="inp" type="text" autocomplete="off" maxlength="22" value="${esc(nombre)}" placeholder="Escribe el nombre" data-field="nombre" style="border:2px solid var(--ink)"></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Ideas</span><div class="chips">${IDEAS.map(([n,i])=>`<button class="chip ${nombre===n?"on":""}" aria-pressed="${nombre===n}" data-act="idea" data-v="${n}"><span class="sq" style="background:var(--neutro)">${ic(i)}</span><span>${n}</span></button>`).join("")}</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Así se verá</span><div class="item" id="prevB" style="cursor:default">${sqB(prev)}<span class="mid"><span class="t" id="prevN">${esc(prev.nombre)}</span></span><span class="rt"><span class="l">Quedan</span><span class="num v">${money(ren?Math.max(0,quedan(b)):0)}</span></span></div>
  <span class="small">${ren?"Solo cambia el nombre. La plata y los gastos se quedan igual.":"En la siguiente pantalla le pones la plata."}</span></div>
  <div class="bottom"><button class="btn" data-act="${ren?"guardarNombre":"crear2"}" ${nombre.trim()?"":"disabled"} id="btnNombre">${ren?"Guardar":"Siguiente"+ic("sig",'style="stroke-width:2.4"')}</button></div>`; };
const nextColor = () => { const usados = bolsillos().filter(b=>!b.otros&&!b.borrado).map(b=>(b.color||0)%6); const cnt=[0,1,2,3,4,5].map(c=>usados.filter(u=>u===c).length); const min=Math.min(...cnt); const ult=usados[usados.length-1]; const op=[0,1,2,3,4,5].filter(c=>cnt[c]===min); return op.find(c=>c!==ult) ?? op[0]; };
V.crear2 = () => { const p=S.p; const otros = bolsillos().find(b=>b.otros); const disp = otros?quedan(otros):0; const m=p.monto||0; const prev={nombre:p.nombre,icono:iconoPara(p.nombre),color:p.color};
  return `<div class="top">${backBtn()}${cancelar("cancelarFlujo")}</div><div style="display:flex;align-items:center;gap:12px">${sqB(prev)}<h1 class="h1">${esc(p.nombre)}</h1></div>
  <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px"><span class="q">¿Cuánta plata le pones este mes?</span><p class="nota" style="margin-top:0">Tienes <b class="num" style="color:var(--ink)">${money(disp)}</b> libres.</p></div>
  <section class="valor" style="border:1.5px solid var(--line)"><span class="num cifra">${money(m)}</span><span class="small">${m<=disp?`Esta plata sale de tu plata libre. Te quedarán <b class="num" style="color:var(--ink)">${money(disp-m)}</b> libres.`:`Solo tienes ${money(disp)} libres. Ponle menos, o después pásale plata de otro bolsillo.`}</span></section>
  ${teclado()}<div class="bottom"><button class="btn" data-act="guardarCrear" ${m<=disp?"":"disabled"}>Crear bolsillo</button><button class="btn3" data-act="guardarCrear0">Dejar en $0 por ahora</button></div>`; };

/* cierre e inicio de mes */
function resumenMes(){ const sob = totalQuedan(); return { recibido: recibido(), sobrante: sob }; }
V.cierre = () => { const r = resumenMes(); const sob=r.sobrante; const nuevo = (S.ahorro?.saldo||0) + sob; const sig = mesSig(S.mesKey); const d=hoy();
  return `${HEADER}<div><h1 class="mes">${cap(mesNombre(mesKey(d)))}</h1><span class="sub">Hoy, ${DIAS[d.getDay()]} ${d.getDate()}</span></div>
  <section class="hero lila" style="gap:14px;padding:20px 22px"><div style="display:flex;flex-direction:column;gap:4px"><span class="h2">${cap(mesNombre(S.mesKey))} terminó</span><span style="font-size:17px;color:var(--lila-t)">${sob>=0?"Te sobraron":"Te faltaron"}</span><span class="num cifra">${money(Math.abs(sob))}</span></div>
  <div style="background:rgba(255,255,255,.75);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px">${sqAhorro("s")}<span class="num" style="flex:1;font-size:16px;line-height:1.35">${sob>=0?`Los guardamos en tu Ahorro. Ahora tienes <b style="font-weight:600">${money(nuevo)}</b>.`:`Los sacamos de tu Ahorro. Ahora tienes <b style="font-weight:600">${money(Math.max(0,nuevo))}</b>.`}</span></div></section>
  <section style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:12px"><span class="h2">Empieza ${mesNombre(sig)}</span><span class="txt" style="font-size:17px">Son 3 pasos cortos: confirmar tu plata, apartar las cuentas y repartir el resto en tus bolsillos.</span><button class="btn" data-act="empezarMes">Empezar ${mesNombre(sig)}</button></section>`; };
const pasos = n => `<div class="steps" role="img" aria-label="Paso ${n} de 3">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><span class="lbl">Paso ${n} de 3</span>`;
V.paso1 = () => { const D=S.draft; const tot = D.ingresos.reduce((s,i)=>s+i.valor,0);
  return `<div style="display:flex;flex-direction:column;gap:10px">${backBtn("Volver al inicio")}${pasos(1)}</div>
  <h1 class="mes" style="margin-top:6px">Empecemos ${mesNombre(D.mes)}</h1><p style="font-size:20px">¿Este mes recibiste esta plata?</p>
  <section style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:16px"><span class="num cifra">${money(tot)}</span>${D.ingresos.map((i,ix)=>`<button class="row" data-act="p1valor" data-ix="${ix}" style="border-top:1.5px solid var(--line);padding-top:14px">${`<span class="sq">${ic("persona")}</span>`}<span class="mid"><span class="t">${esc(i.nombre)}</span><span class="s">Todos los meses</span></span><span class="num v">${money(i.valor)}</span>${ic("pen",'class="ic pen"')}</button>`).join("")}${D.extra.map(i=>`<div class="row" style="border-top:1.5px solid var(--line);padding-top:14px;cursor:default"><span class="sq">${ic("billete")}</span><span class="mid"><span class="t">${esc(i.nombre||"Otro ingreso")}</span><span class="s">Solo este mes</span></span><span class="num v">${money(i.valor)}</span></div>`).join("")}</section>

/* ---------- render ---------- */
function render(){
  const app = $("#app"), layer = $("#layer");
  if(!S.ok || S.cargar){ return; }
  if(S.mesKey && !S.mesListo){ return; }
  if(!S.mes){ app.className=""; app.innerHTML = `${HEADER}<div class="empty"><p class="q">Todavía no hay un mes cargado</p><p class="small">Daniela está preparando tus cuentas y bolsillos. Cuando estén listos, aquí vas a ver tus cuentas y tus bolsillos.</p></div>`; layer.innerHTML=""; return; }
  let v = S.view; let hoja = "";
  if(v==="menu"){ hoja = hojaMenu(); v = S.p.base||"inicio"; }
  if(v==="noAlcanza"){ hoja = hojaNoAlcanza(); v="gasto"; }
  if(v==="borrar"){ hoja = hojaBorrar(); v="bolsillo"; }
  if(v==="inicio" && necesitaCierre()) v = "cierre";
  const fn = V[v] || V.inicio;
  app.className = (TABS.includes(v)) ? "" : "flow";
  app.innerHTML = fn();
  layer.innerHTML = hoja;
  renderToast();
  const f = app.querySelector("[autofocus]"); if(f) f.focus();
  ajustarBottom();
}
function ajustarBottom(){ const b=document.querySelector("#app.flow .bottom"); if(!b) return; const fin = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2; b.classList.toggle("flota", !fin); }
window.addEventListener("scroll", ajustarBottom, {passive:true}); window.addEventListener("resize", ajustarBottom);

A.guardarGasto = () => { const p=S.p; const b=bolsillos().find(x=>x.id===p.bolsillo); const ant = p.editId?gastos().find(g=>g.id===p.editId):null;
  const disp = quedan(b) + (ant && ant.bolsillo===b.id ? +ant.valor : 0);
  if(p.monto > disp && !p.cubierto){ S.p.falta = p.monto - Math.max(0,disp); S.p.quedaba = disp; S.p.origen = null; S.view="noAlcanza"; render(); return; }
  const nota = b.otros ? (p.nota||"").trim() : "";
  const id = p.editId || uid(); const fecha = ant?.fecha || ymd(hoy());
  cambioMes(m => { m.gastos = (m.gastos||[]).filter(g=>g.id!==id); m.gastos.push({id, bolsillo:b.id, valor:p.monto, fecha, nota}); if(p.cubierto && p.cubierto!=="ahorro"){ const o=m.bolsillos.find(x=>x.id===p.cubierto); const d=m.bolsillos.find(x=>x.id===b.id); if(!o.otros) o.asignado -= p.falta; if(!d.otros) d.asignado += p.falta; } }, p.editId?"Gasto cambiado":"Gasto agregado en "+b.nombre);
  if(p.cubierto==="ahorro"){ moverDesdeAhorro(b.id, p.falta); }
  volver();
};

      const b = writeBatch(fs);
      b.set(fsDoc(fs,"config/main"), d.config); b.set(fsDoc(fs,"ahorro/main"), d.ahorro);
      Object.entries(d.meses).forEach(([k,v])=>b.set(fsDoc(fs,"meses/"+k), v));
      b.set(fsDoc(fs,"estado/main"), d.estado);
      await b.commit(); $("#msg").textContent="Listo. Tus datos quedaron cargados.";
    } catch(err){ $("#msg").textContent = err.message==="archivo" ? "Ese no es el archivo de Mima. Escoge datos-octubre-mima.json." : "No se pudo cargar. Revisa que las reglas de Firestore estén pegadas e intenta otra vez."; } };
}
let subs = [];
function conectar(user){
  subs.forEach(u=>u()); subs=[]; if(unsubMes){ unsubMes(); unsubMes=null; } if(unsubBorr){ unsubBorr(); unsubBorr=null; }
  S.db = FDB; S.user = user; S.ok = true;
  const err = e => { S.ok=false; subs.forEach(u=>u()); subs=[]; if(unsubMes){ unsubMes(); unsubMes=null; }
    if(e && e.code==="permission-denied") return pantallaNoPermitido(user.email||"");
    $("#app").className="flow"; $("#app").innerHTML = caja("No se pudieron abrir tus cuentas", "Revisa tu conexión a internet y vuelve a abrir Mima."); };
  subs.push(FDB.doc("config/main").onSnapshot(s=>{ S.cfg = s.exists ? s.data() : {cuentas:[],ingresosFijos:[]}; render(); }, err));
  subs.push(FDB.doc("ahorro/main").onSnapshot(s=>{ S.ahorro = s.exists ? s.data() : {saldo:0,movimientos:[]}; render(); }, err));
  subs.push(FDB.doc("estado/main").onSnapshot(s=>{ const k = s.exists ? s.data().mesActual : null;
    if(!k){ S.mesKey=null; S.mes=null; S.cargar=true; pantallaCargarDatos(); return; }
    S.cargar=false;
    if(k!==S.mesKey){ S.mesKey=k; if(unsubMes) unsubMes(); S.mes=null; S.mesListo=false; unsubMes = FDB.doc("meses/"+k).onSnapshot(ms=>{ S.mes = ms.exists ? ms.data() : null; S.mesListo=true; if(!S.cfg) return; render(); }, err); if(unsubBorr) unsubBorr(); S.borr=null; unsubBorr = FDB.doc("borrador/"+mesSig(k)).onSnapshot(bs=>{ S.borr = bs.exists ? bs.data() : null; if(S.cfg && S.mesListo) render(); }, ()=>{}); } }, err));
}
onAuthStateChanged(auth, user => {
  if(!user){ subs.forEach(u=>u()); subs=[]; S.ok=false; pantallaEntrar(); return; }
  conectar(user);
});
A.salir = () => signOut(auth);

})();
</script>
